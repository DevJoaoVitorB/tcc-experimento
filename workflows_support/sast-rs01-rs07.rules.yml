rules:
  # RS01 - Controle de acesso e autorização (OWASP A01)
  - id: rs01-prisma-request-value-in-resource-query
    message: >-
      Valor controlado pela requisição usado em consulta ou alteração Prisma.
      Confirme autenticação, autorização por recurso e propriedade do registro;
      esta regra não consegue provar que a verificação está ausente.
    severity: WARNING
    languages: [javascript, typescript]
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: '$REQ.params.$FIELD'
          - pattern: '$REQ.query.$FIELD'
          - pattern: '$REQ.body.$FIELD'
    pattern-sinks:
      - pattern-either:
          - pattern: '$PRISMA.$MODEL.findUnique({ ..., where: {..., $FIELD: $VALUE, ...}, ... })'
          - pattern: '$PRISMA.$MODEL.findFirst({ ..., where: {..., $FIELD: $VALUE, ...}, ... })'
          - pattern: '$PRISMA.$MODEL.findMany({ ..., where: {..., $FIELD: $VALUE, ...}, ... })'
          - pattern: '$PRISMA.$MODEL.update({ ..., where: {..., $FIELD: $VALUE, ...}, ... })'
          - pattern: '$PRISMA.$MODEL.updateMany({ ..., where: {..., $FIELD: $VALUE, ...}, ... })'
          - pattern: '$PRISMA.$MODEL.delete({ ..., where: {..., $FIELD: $VALUE, ...}, ... })'
          - pattern: '$PRISMA.$MODEL.deleteMany({ ..., where: {..., $FIELD: $VALUE, ...}, ... })'

  - id: rs01-prisma-request-body-mass-assignment
    message: >-
      Corpo da requisição passado diretamente para escrita Prisma. Use uma lista
      explícita de campos permitidos e proteja atributos de função, proprietário
      e autorização. A regra não determina sozinha quais campos são sensíveis.
    severity: WARNING
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: '$PRISMA.$MODEL.create({ ..., data: $REQ.body, ... })'
          - pattern: '$PRISMA.$MODEL.update({ ..., data: $REQ.body, ... })'
          - pattern: '$PRISMA.$MODEL.upsert({ ..., create: $REQ.body, ..., update: $REQ.body, ... })'

  # RS02 - Configuração segura e exposição de informações (OWASP A02)
  - id: rs02-hardcoded-jwt-secret
    message: >-
      Segredo JWT aparentemente literal no código. Use configuração segura por
      ambiente ou gerenciador de segredos; confirme se o valor é realmente secreto.
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - pattern: 'jwt.sign($PAYLOAD, "...")'
      - pattern: "jwt.sign($PAYLOAD, '...')"
      - pattern: 'jwt.verify($TOKEN, "...")'
      - pattern: "jwt.verify($TOKEN, '...')"
      - pattern: 'jsonwebtoken.sign($PAYLOAD, "...")'
      - pattern: 'jsonwebtoken.verify($TOKEN, "...")'

  - id: rs02-secret-environment-fallback
    message: >-
      Variável de ambiente possui fallback literal possivelmente previsível.
      Verifique se a aplicação falha de forma segura quando o segredo não existe.
    severity: WARNING
    languages: [javascript, typescript]
    pattern-either:
      - pattern: 'process.env.$NAME || "..."'
      - pattern: "process.env.$NAME || '...'"
      - pattern: 'process.env.$NAME ?? "..."'
      - pattern: "process.env.$NAME ?? '...'"

  - id: rs02-permissive-cors
    message: >-
      CORS aparenta permitir qualquer origem. Avalie a necessidade e o contexto
      da API, especialmente a combinação com credenciais; origem universal não
      deve ser classificada automaticamente como vulnerabilidade.
    severity: WARNING
    languages: [javascript, typescript]
    pattern-either:
      - pattern: 'cors({ ..., origin: "*", ... })'
      - pattern: "cors({ ..., origin: '*', ... })"
      - pattern: 'res.setHeader("Access-Control-Allow-Origin", "*")'
      - pattern: "res.setHeader('Access-Control-Allow-Origin', '*')"
      - pattern: 'res.header("Access-Control-Allow-Origin", "*")'
      - pattern: "res.header('Access-Control-Allow-Origin', '*')"

  - id: rs02-environment-exposure
    message: >-
      Variáveis de ambiente podem estar sendo enviadas na resposta HTTP.
      Confirme se dados internos ou segredos ficam acessíveis ao cliente.
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - pattern: 'res.send(process.env)'
      - pattern: 'res.json(process.env)'
      - pattern: 'res.end(JSON.stringify(process.env))'

  - id: rs02-disabled-tls-verification
    message: >-
      Verificação de certificado TLS aparentemente desativada, reduzindo a
      proteção contra interceptação de conexões.
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - pattern: 'new https.Agent({ ..., rejectUnauthorized: false, ... })'
      - pattern: 'new tls.TLSSocket($SOCKET, { ..., rejectUnauthorized: false, ... })'
      - pattern: 'process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"'
      - pattern: "process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0'"

  - id: rs02-debug-mode-enabled
    message: >-
      Configuração de depuração aparentemente ativada. Confirme que o modo debug
      não fica habilitado em execução de produção nem expõe dados internos.
    severity: WARNING
    languages: [javascript, typescript]
    pattern-either:
      - pattern: 'app.set("env", "development")'
      - pattern: "app.set('env', 'development')"
      - pattern: 'debug: true'

  # RS04 - Uso e armazenamento de credenciais (OWASP A04)
  # OBS.: A análise estática identifica padrões visíveis, mas não comprova o valor persistido.
  - id: rs04-weak-password-hash
    message: >-
      MD5 ou SHA-1 usado em possível contexto de credenciais. Prefira hash próprio
      para senhas, como Argon2id, scrypt ou bcrypt com parâmetros adequados.
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - pattern: 'crypto.createHash("md5")'
      - pattern: "crypto.createHash('md5')"
      - pattern: 'crypto.createHash("sha1")'
      - pattern: "crypto.createHash('sha1')"

  - id: rs04-password-persisted-without-visible-hash
    message: >-
      Senha da requisição aparece diretamente em dados enviados para persistência.
      Revise o fluxo completo de transformação antes de confirmar falha de hashing.
    severity: WARNING
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: '$PRISMA.$MODEL.create({ ..., data: { ..., password: $REQ.body.password, ... }, ... })'
          - pattern: '$PRISMA.$MODEL.create({ ..., data: { ..., senha: $REQ.body.senha, ... }, ... })'
          - pattern: '$PRISMA.$MODEL.update({ ..., data: { ..., password: $REQ.body.password, ... }, ... })'
          - pattern: '$PRISMA.$MODEL.update({ ..., data: { ..., senha: $REQ.body.senha, ... }, ... })'

  - id: rs04-password-in-response
    message: >-
      Campo de senha aparenta ser incluído na resposta HTTP. Retorne apenas os
      dados públicos necessários e nunca exponha senha ou hash de senha.
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - pattern: 'res.json({ ..., password: $VALUE, ... })'
      - pattern: 'res.json({ ..., senha: $VALUE, ... })'
      - pattern: 'res.send({ ..., password: $VALUE, ... })'
      - pattern: 'res.send({ ..., senha: $VALUE, ... })'

  - id: rs04-password-logging
    message: >-
      Senha pode estar sendo enviada para log. Evite registrar credenciais ou
      outros dados sensíveis, inclusive durante tratamento de erros.
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - pattern: 'console.log(..., $REQ.body.password, ...)'
      - pattern: 'console.log(..., $REQ.body.senha, ...)'
      - pattern: 'console.error(..., $REQ.body.password, ...)'
      - pattern: 'console.error(..., $REQ.body.senha, ...)'

  # RS05 - Validação e uso de entradas não confiáveis (OWASP A05)
  - id: rs05-prisma-raw-unsafe
    message: >-
      Operação SQL bruta potencialmente insegura do Prisma. Verifique se entradas
      externas podem alterar a consulta; prefira consultas parametrizadas.
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - pattern: '$PRISMA.$queryRawUnsafe(...)'
      - pattern: '$PRISMA.$executeRawUnsafe(...)'

  - id: rs05-request-input-to-dangerous-operation
    message: >-
      Entrada HTTP pode alcançar operação sensível sem validação visível. Revise
      sanitização, validação de tipos e contexto de uso; o fluxo completo pode
      incluir validação não reconhecida por esta regra.
    severity: WARNING
    languages: [javascript, typescript]
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: '$REQ.body'
              - pattern: '$REQ.query.$FIELD'
              - pattern: '$REQ.params.$FIELD'
    pattern-sinks:
      - pattern-either:
          - pattern: 'eval($VALUE)'
          - pattern: 'child_process.exec($VALUE, ...)'
          - pattern: 'child_process.execSync($VALUE, ...)'
          - pattern: 'new RegExp($VALUE, ...)'
          - pattern: 'fs.readFile($VALUE, ...)'
          - pattern: 'fs.readFileSync($VALUE, ...)'
          - pattern: 'fs.createReadStream($VALUE, ...)'

  # RS06 - Autenticação e identificação (OWASP A07)
  # OBS.: Verificação de expiração e assinatura depende também de opções e fluxos externos.
  - id: rs06-jwt-decode-without-verification
    message: >-
      jwt.decode não valida a assinatura do token. Não o use isoladamente para
      autenticar ou autorizar requisições; confronte o fluxo com testes dinâmicos.
    severity: WARNING
    languages: [javascript, typescript]
    pattern-either:
      - pattern: 'jwt.decode($TOKEN, ...)'
      - pattern: 'jsonwebtoken.decode($TOKEN, ...)'

  - id: rs06-jwt-none-algorithm
    message: >-
      Algoritmo JWT none explicitamente configurado. Não aceite tokens sem
      assinatura para autenticação.
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - pattern: 'jwt.verify($TOKEN, $SECRET, { ..., algorithms: ["none"], ... })'
      - pattern: "jwt.verify($TOKEN, $SECRET, { ..., algorithms: ['none'], ... })"
      - pattern: 'jwt.sign($PAYLOAD, $SECRET, { ..., algorithm: "none", ... })'
      - pattern: "jwt.sign($PAYLOAD, $SECRET, { ..., algorithm: 'none', ... })"

  - id: rs06-jwt-sign-without-visible-expiration
    message: >-
      Emissão de JWT sem expiração visível nas opções. Verifique duração limitada,
      validação do token e política de renovação; a regra pode não reconhecer
      configurações construídas dinamicamente.
    severity: WARNING
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: 'jwt.sign($PAYLOAD, $SECRET)'
          - pattern: 'jsonwebtoken.sign($PAYLOAD, $SECRET)'
          - pattern: 'jwt.sign($PAYLOAD, $SECRET, $OPTIONS)'
          - pattern: 'jsonwebtoken.sign($PAYLOAD, $SECRET, $OPTIONS)'
      - pattern-not: 'jwt.sign($PAYLOAD, $SECRET, { ..., expiresIn: $EXP, ... })'
      - pattern-not: 'jsonwebtoken.sign($PAYLOAD, $SECRET, { ..., expiresIn: $EXP, ... })'

  - id: rs06-insecure-cookie
    message: >-
      Cookie pode estar sem atributos de segurança. Verifique HttpOnly, Secure e
      SameSite de acordo com o modelo de autenticação e ambiente de implantação.
    severity: WARNING
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: 'res.cookie($NAME, $VALUE)'
          - pattern: 'res.cookie($NAME, $VALUE, $OPTIONS)'
      - pattern-not: |
          res.cookie($NAME, $VALUE, {
            ..., httpOnly: true, ..., secure: true, ..., sameSite: "strict", ...
          })
      - pattern-not: |
          res.cookie($NAME, $VALUE, {
            ..., httpOnly: true, ..., secure: true, ..., sameSite: "lax", ...
          })
      - pattern-not: |
          res.cookie($NAME, $VALUE, {
            ..., httpOnly: true, ..., secure: true, ..., sameSite: "none", ...
          })

  - id: rs06-account-enumeration-message
    message: >-
      Mensagem pode revelar se uma conta existe. Compare respostas para conta
      inexistente e senha incorreta e confirme o resultado com testes dinâmicos.
    severity: WARNING
    languages: [javascript, typescript]
    pattern-regex: (?i)(usuário não encontrado|usuario nao encontrado|email não cadastrado|email nao cadastrado|user not found|email not found|invalid username|unknown user)

  # RS07 - Tratamento de erros e exposição de informações (OWASP A10)
  - id: rs07-stack-trace-in-response
    message: >-
      Stack trace pode estar sendo enviado na resposta HTTP. Retorne mensagem
      genérica ao cliente e registre detalhes internamente com controle de acesso.
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - pattern: 'res.json({ ..., stack: $ERR.stack, ... })'
      - pattern: 'res.send({ ..., stack: $ERR.stack, ... })'
      - pattern: 'res.status($STATUS).json({ ..., stack: $ERR.stack, ... })'
      - pattern: 'res.status($STATUS).send({ ..., stack: $ERR.stack, ... })'

  - id: rs07-error-message-in-response
    message: >-
      Mensagem interna de erro pode ser exposta ao cliente. Confirme se contém
      caminhos, consultas, dados sensíveis ou detalhes de implementação.
    severity: WARNING
    languages: [javascript, typescript]
    pattern-either:
      - pattern: 'res.json({ ..., error: $ERR.message, ... })'
      - pattern: 'res.json({ ..., message: $ERR.message, ... })'
      - pattern: 'res.send({ ..., error: $ERR.message, ... })'
      - pattern: 'res.send({ ..., message: $ERR.message, ... })'
      - pattern: 'res.status($STATUS).json({ ..., error: $ERR.message, ... })'
      - pattern: 'res.status($STATUS).json({ ..., message: $ERR.message, ... })'

  # Regra informativa: catch vazio pode ser intencional; revisar contexto antes de classificar.
  - id: rs07-empty-catch-review
    message: >-
      Bloco catch vazio detectado. Revise o contexto para determinar se a exceção
      deveria ser registrada, tratada ou propagada; este padrão não confirma falha.
    severity: INFO
    languages: [javascript, typescript]
    pattern-either:
      - pattern: |
          try {
            ...
          } catch ($ERR) {
          }
      - pattern: |
          try {
            ...
          } catch ($ERR) {
            ;
          }
