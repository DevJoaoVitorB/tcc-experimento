env:
    contexts:
        - name: authentication-api
          urls:
              - http://127.0.0.1:3000
          includePaths:
              - http://127\.0\.0\.1:3000/.*

    vars:
        baseUrl: http://127.0.0.1:3000

jobs:
    # 1. Carrega os scripts customizados de Active Scan.
    - type: script
      parameters:
          action: add
          type: active
          engine: 'ECMAScript : Graal.js'
          name: rs01-access-control
          source: /zap/wrk/workflows_support/dast/scripts/rs01-access-control.js

    - type: script
      parameters:
          action: add
          type: active
          engine: 'ECMAScript : Graal.js'
          name: rs02-security-configuration
          source: /zap/wrk/workflows_support/dast/scripts/rs02-security-configuration.js

    - type: script
      parameters:
          action: add
          type: active
          engine: 'ECMAScript : Graal.js'
          name: rs04-credential-management
          source: /zap/wrk/workflows_support/dast/scripts/rs04-credential-management.js

    - type: script
      parameters:
          action: add
          type: active
          engine: 'ECMAScript : Graal.js'
          name: rs05-input-validation
          source: /zap/wrk/workflows_support/dast/scripts/rs05-input-validation.js

    - type: script
      parameters:
          action: add
          type: active
          engine: 'ECMAScript : Graal.js'
          name: rs06-authentication-protection
          source: /zap/wrk/workflows_support/dast/scripts/rs06-authentication-protection.js

    - type: script
      parameters:
          action: add
          type: active
          engine: 'ECMAScript : Graal.js'
          name: rs07-exception-handling
          source: /zap/wrk/workflows_support/dast/scripts/rs07-exception-handling.js

    # 2. Inclui um endpoint protegido na árvore de sites.
    - type: requestor
      requests:
          - url: http://127.0.0.1:3000/health
            name: Verificar disponibilidade da API
            method: GET

    # 3. Descobre rotas acessíveis antes do Active Scan.
    - type: spider
      parameters:
          context: authentication-api
          url: http://127.0.0.1:3000/health
          maxDuration: 2

    # 4. Executa a análise dinâmica da API.
    - type: activeScan
      parameters:
          url: http://127.0.0.1:3000
          context: authentication-api
          defaultStrength: Medium
          defaultThreshold: Off
          maxScanDurationInMins: 15
          maxRuleDurationInMins: 5
          delayInMs: 100
          threadPerHost: 2
          maxAlertsPerRule: 20
      policyDefinition:
          defaultStrength: Medium
          defaultThreshold: Off
          rules:
              - id: 110101
                name: RS01 - Controle de acesso e autorização
                strength: Medium
                threshold: Medium
              - id: 110201
                name: RS02 - Configuração de segurança
                strength: Medium
                threshold: Medium
              - id: 110401
                name: RS04 - Gerenciamento de credenciais
                strength: Medium
                threshold: Medium
              - id: 110501
                name: RS05 - Validação de entradas
                strength: Medium
                threshold: Medium
              - id: 110601
                name: RS06 - Autenticação e gerenciamento de sessão
                strength: Medium
                threshold: Medium
              - id: 110701
                name: RS07 - Tratamento seguro de erros
                strength: Medium
                threshold: Medium

    # 5. Aguarda a conclusão da análise passiva.
    - type: passiveScan-wait
      parameters:
          maxDuration: 5

    # 6. Gera o relatório JSON.
    - type: report
      parameters:
          template: traditional-json
          reportDir: /zap/out
          reportFile: zap-report.json
          reportTitle: 'DAST - Authentication API - RS01-RS07'
          reportDescription: 'Resultados da análise dinâmica da API de autenticação.'

    # 7. Gera o relatório HTML.
    - type: report
      parameters:
          template: traditional-html
          reportDir: /zap/out
          reportFile: zap-report.html
          reportTitle: 'DAST - Authentication API - RS01-RS07'
          reportDescription: 'Resultados da análise dinâmica da API de autenticação.'
