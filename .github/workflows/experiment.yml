name: Authentication API Experiment

on:
    workflow_dispatch:
        inputs:
            group:
                description: 'Grupo do experimento'
                required: true
                type: choice
                options: [A, B]

permissions:
    contents: read

jobs:
    # 1. Validação funcional e captura do ambiente.
    validate:
        name: Validate Application
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.14.0
                  cache: npm
            - name: Validate application
              env:
                  DATABASE_URL: 'file:./test.db'
              run: |
                  npm ci
                  npx prisma generate
                  npm test -- --exclude "workflows_support/dast-rs01-rs07.test.ts"
                  npm run build
            - name: Capture validation evidence
              if: always()
              shell: bash
              run: |
                  mkdir -p evidence
                  {
                    echo "run_id=$GITHUB_RUN_ID"
                    echo "run_attempt=$GITHUB_RUN_ATTEMPT"
                    echo "commit=$GITHUB_SHA"
                    echo "ref=$GITHUB_REF"
                    echo "runner_os=$RUNNER_OS"
                    echo "runner_arch=$RUNNER_ARCH"
                    echo "node=$(node --version 2>&1 || true)"
                    echo "npm=$(npm --version 2>&1 || true)"
                    echo "docker=$(docker --version 2>&1 || true)"
                    echo "node_version_requested=22.14.0"
                    echo "commands=npm ci; npx prisma generate; npm test; npm run build"
                  } > evidence/environment.txt
                  for file in package.json package-lock.json AGENTS.md .github/workflows/experiment.yml workflows_support/sast-rs01-rs07.rules.yml workflows_support/dast-rs01-rs07.test.ts docker-compose.yml compose.yml Dockerfile; do
                    [ ! -f "$file" ] || sha256sum "$file" >> evidence/input-sha256.txt
                  done
            - name: Upload raw validation evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: raw-validate-${{ inputs.group }}
                  path: evidence/
                  if-no-files-found: warn
                  retention-days: 90

    # 2. SAST: mantém as regras Semgrep e o relatório original com severidades nativas.
    sast:
        name: SAST (Semgrep)
        runs-on: ubuntu-24.04
        needs: validate
        steps:
            - uses: actions/checkout@v4
            - name: Run Semgrep
              shell: bash
              run: |
                  mkdir -p evidence
                  set +e
                  docker run --rm -v "$PWD:/src:ro" -v "$PWD/evidence:/reports:rw" -w /src \
                    semgrep/semgrep:1.178.0 semgrep scan \
                    --config p/security-audit --config p/secrets --config p/owasp-top-ten \
                    --config p/javascript --config p/typescript --config p/nodejs --config p/jwt \
                    --config /src/workflows_support/sast-rs01-rs07.rules.yml \
                    --json --output /reports/sast-report.json . > evidence/sast-console.txt 2>&1
                  code=$?
                  echo "$code" > evidence/sast-exit-code.txt
                  set -e
                  cat evidence/sast-console.txt
                  # Código 1 indica achados; outros códigos diferentes de 0/1 indicam erro operacional.
                  if [ "$code" != "0" ] && [ "$code" != "1" ]; then
                    echo "Semgrep terminou com erro operacional (código $code)." >&2
                    exit 1
                  fi
            - name: Capture SAST configuration
              if: always()
              shell: bash
              run: |
                  mkdir -p evidence
                  docker run --rm semgrep/semgrep:1.178.0 semgrep --version > evidence/semgrep-version.txt 2>&1 || true
                  cp workflows_support/sast-rs01-rs07.rules.yml evidence/ 2>/dev/null || true
                  cp .github/workflows/experiment.yml evidence/experiment.yml 2>/dev/null || true
                  {
                    echo "run_id=$GITHUB_RUN_ID"
                    echo "run_attempt=$GITHUB_RUN_ATTEMPT"
                    echo "commit=$GITHUB_SHA"
                    echo "ref=$GITHUB_REF"
                    echo "runner_os=$RUNNER_OS"
                    echo "image=semgrep/semgrep:1.178.0"
                    echo "configs=p/security-audit;p/secrets;p/owasp-top-ten;p/javascript;p/typescript;p/nodejs;p/jwt;workflows_support/sast-rs01-rs07.rules.yml"
                  } > evidence/environment.txt
            - name: Upload raw SAST evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: raw-sast-${{ inputs.group }}
                  path: evidence/
                  if-no-files-found: warn
                  retention-days: 90

    # 3. SCA: audita todas as dependências e apenas as de produção.
    sca:
        name: SCA (npm audit)
        runs-on: ubuntu-24.04
        needs: validate
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.14.0
                  cache: npm
            - name: Audit dependencies
              shell: bash
              run: |
                  mkdir -p evidence
                  npm ci
                  # npm audit pode retornar código diferente de zero por vulnerabilidades; preserva os relatórios.
                  set +e
                  npm audit --json > evidence/sca-report-all.json 2> evidence/sca-stderr-all.txt
                  echo "$?" > evidence/npm-audit-all-exit-code.txt
                  npm audit --omit=dev --json > evidence/sca-report-production.json 2> evidence/sca-stderr-production.txt
                  echo "$?" > evidence/npm-audit-production-exit-code.txt
                  set -e
                  {
                    echo "run_id=$GITHUB_RUN_ID"
                    echo "run_attempt=$GITHUB_RUN_ATTEMPT"
                    echo "commit=$GITHUB_SHA"
                    echo "ref=$GITHUB_REF"
                    echo "runner_os=$RUNNER_OS"
                    echo "node=$(node --version 2>&1 || true)"
                    echo "npm=$(npm --version 2>&1 || true)"
                    echo "commands=npm audit --json; npm audit --omit=dev --json"
                  } > evidence/environment.txt
                  cp package.json package-lock.json evidence/
                  sha256sum package.json package-lock.json > evidence/dependency-files-sha256.txt
            - name: Upload raw SCA evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: raw-sca-${{ inputs.group }}
                  path: evidence/
                  if-no-files-found: warn
                  retention-days: 90

    # 4. DAST: inicia a API, prepara o OpenAPI e executa ZAP + testes RS01–RS07.
    dast:
        name: DAST (OWASP ZAP + Complementary Tests)
        runs-on: ubuntu-24.04
        needs: validate
        timeout-minutes: 30
        env:
            JWT_ACCESS_SECRET: 'dast-test-access-secret-CHANGE-ME-123456789'
            JWT_REFRESH_SECRET: 'dast-test-refresh-secret-CHANGE-ME-123456789'
            DAST_BASE_URL: http://localhost:3000
            DAST_RATE_LIMIT_ATTEMPTS: '30'

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22.14.0'
                  cache: npm

            - name: Initialize DAST evidence directory
              shell: bash
              run: |
                  EVIDENCE="$GITHUB_WORKSPACE/.dast-evidence"
                  mkdir -p "$EVIDENCE"
                  echo "125" > "$EVIDENCE/compose-up-exit-code.txt"
                  echo "125" > "$EVIDENCE/zap-exit-code.txt"
                  echo "125" > "$EVIDENCE/complementary-exit-code.txt"
                  echo "DAST evidence directory: $EVIDENCE"

            - name: Start API and prepare OpenAPI
              shell: bash
              run: |
                  EVIDENCE="$GITHUB_WORKSPACE/.dast-evidence"

                  set +e
                  docker compose up --build -d > "$EVIDENCE/compose-up.txt" 2>&1
                  compose_exit=$?
                  echo "$compose_exit" > "$EVIDENCE/compose-up-exit-code.txt"
                  set -e

                  cat "$EVIDENCE/compose-up.txt"

                  if [ "$compose_exit" -eq 0 ]; then
                    for attempt in {1..30}; do
                      if curl -fsS "$DAST_BASE_URL/health" >/dev/null 2>&1 &&
                         curl -fsS "$DAST_BASE_URL/openapi.json" \
                           -o "$EVIDENCE/openapi-runtime.json" &&
                         jq -e 'type == "object" and .openapi != null and (.paths | type == "object")' \
                           "$EVIDENCE/openapi-runtime.json" >/dev/null; then

                        jq '
                          if (.servers | type) == "array" and (.servers | length) > 0 then
                            .servers[0].url = "http://host.docker.internal:3000" |
                            .servers = [.servers[0]]
                          else
                            .servers = [{"url":"http://host.docker.internal:3000"}]
                          end
                        ' "$EVIDENCE/openapi-runtime.json" \
                          > "$EVIDENCE/openapi-for-zap.json"

                        break
                      fi
                      sleep 2
                    done
                  fi

                  if [ ! -s "$EVIDENCE/openapi-for-zap.json" ]; then
                    {
                      echo "OpenAPI ausente ou inválido após até 30 tentativas."
                      docker compose ps -a 2>&1 || true
                      docker compose logs --no-color --tail=200 2>&1 || true
                    } > "$EVIDENCE/openapi-error.txt"
                  fi

            - name: Run ZAP and complementary tests
              if: always()
              shell: bash
              env:
                  DAST_REPORT_PATH: ${{ github.workspace }}/.dast-evidence/dast-rs01-rs07-report.json
              run: |
                  EVIDENCE="$GITHUB_WORKSPACE/.dast-evidence"
                  mkdir -p "$EVIDENCE"

                  # Mantém os códigos padrão caso alguma execução não seja iniciada.
                  [ -f "$EVIDENCE/zap-exit-code.txt" ] ||
                    echo "125" > "$EVIDENCE/zap-exit-code.txt"
                  [ -f "$EVIDENCE/complementary-exit-code.txt" ] ||
                    echo "125" > "$EVIDENCE/complementary-exit-code.txt"

                  # OWASP ZAP: não depende do sucesso dos testes complementares.
                  if [ -s "$EVIDENCE/openapi-for-zap.json" ]; then
                    set +e
                    docker run --rm \
                      --add-host=host.docker.internal:host-gateway \
                      -v "$EVIDENCE:/zap/wrk/:rw" \
                      ghcr.io/zaproxy/zaproxy:2.16.1 \
                      zap-api-scan.py \
                      -t /zap/wrk/openapi-for-zap.json \
                      -f openapi \
                      -J zap-report.json \
                      -r zap-report.html \
                      > "$EVIDENCE/zap-console.log" 2>&1
                    zap_exit=$?
                    set -e

                    echo "$zap_exit" > "$EVIDENCE/zap-exit-code.txt"
                  else
                    echo "OpenAPI ausente; ZAP não executado." \
                      > "$EVIDENCE/zap-console.log"
                    echo "125" > "$EVIDENCE/zap-exit-code.txt"
                  fi

                  # Testes RS01–RS07, executados independentemente do resultado do ZAP.
                  set +e
                  npm ci > "$EVIDENCE/npm-ci.log" 2>&1
                  install_exit=$?
                  set -e

                  if [ "$install_exit" -eq 0 ]; then
                    set +e
                    node --experimental-strip-types \
                      workflows_support/dast-rs01-rs07.test.ts \
                      > "$EVIDENCE/complementary-console.log" 2>&1
                    complementary_exit=$?
                    set -e
                  else
                    complementary_exit="$install_exit"
                    echo "npm ci falhou; testes complementares não executados." \
                      > "$EVIDENCE/complementary-console.log"
                  fi

                  echo "$complementary_exit" \
                    > "$EVIDENCE/complementary-exit-code.txt"

                  echo "=== DAST exit codes ==="
                  for file in compose-up-exit-code.txt zap-exit-code.txt complementary-exit-code.txt; do
                    echo "$file: $(cat "$EVIDENCE/$file")"
                  done

            - name: Capture DAST configuration and hashes
              if: always()
              shell: bash
              run: |
                  EVIDENCE="$GITHUB_WORKSPACE/.dast-evidence"
                  mkdir -p "$EVIDENCE"

                  {
                    echo "run_id=$GITHUB_RUN_ID"
                    echo "run_attempt=$GITHUB_RUN_ATTEMPT"
                    echo "commit=$GITHUB_SHA"
                    echo "ref=$GITHUB_REF"
                    echo "runner_os=$RUNNER_OS"
                    echo "node=$(node --version 2>&1 || true)"
                    echo "npm=$(npm --version 2>&1 || true)"
                    echo "docker=$(docker --version 2>&1 || true)"
                    echo "zap_image=ghcr.io/zaproxy/zaproxy:2.16.1"
                    echo "api_base_url=$DAST_BASE_URL"
                    echo "openapi_url=$DAST_BASE_URL/openapi.json"
                    echo "complementary_test=workflows_support/dast-rs01-rs07.test.ts"
                    echo "DAST_RATE_LIMIT_ATTEMPTS=$DAST_RATE_LIMIT_ATTEMPTS"
                  } > "$EVIDENCE/environment.txt"

                  cp .github/workflows/experiment.yml "$EVIDENCE/" 2>/dev/null || true
                  cp workflows_support/dast-rs01-rs07.test.ts "$EVIDENCE/" 2>/dev/null || true
                  cp workflows_support/sast-rs01-rs07.rules.yml "$EVIDENCE/" 2>/dev/null || true
                  cp docker-compose.yml "$EVIDENCE/" 2>/dev/null ||
                    cp compose.yml "$EVIDENCE/" 2>/dev/null || true
                  [ ! -f Dockerfile ] || cp Dockerfile "$EVIDENCE/"

                  find "$EVIDENCE" -maxdepth 1 -type f \
                    ! -name evidence-sha256.txt -print0 |
                    sort -z |
                    xargs -0 -r sha256sum > "$EVIDENCE/evidence-sha256.txt"

            - name: Upload raw DAST evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: raw-dast-${{ inputs.group }}
                  path: ${{ github.workspace }}/.dast-evidence/
                  if-no-files-found: error
                  retention-days: 90

            - name: Check DAST execution status
              if: always()
              shell: bash
              run: |
                  EVIDENCE="$GITHUB_WORKSPACE/.dast-evidence"
                  errors=0

                  for file in compose-up-exit-code.txt zap-exit-code.txt complementary-exit-code.txt; do
                    if [ ! -s "$EVIDENCE/$file" ]; then
                      echo "::error::Arquivo ausente ou vazio: $file"
                      errors=1
                    elif [ "$(cat "$EVIDENCE/$file")" != "0" ]; then
                      echo "::error::Etapa falhou ou não foi executada: $file (código $(cat "$EVIDENCE/$file"))"
                      errors=1
                    fi
                  done

                  if [ ! -s "$EVIDENCE/openapi-for-zap.json" ]; then
                    echo "::error::OpenAPI ausente ou vazio; ZAP não pôde executar."
                    errors=1
                  fi

                  exit "$errors"

            - name: Stop API
              if: always()
              shell: bash
              run: docker compose down --volumes --remove-orphans

    # 5. Empacota os resultados: quatro JSONs de evidência e um relatório Markdown.
    package-evidence:
        name: Package evidence and generate analysis
        runs-on: ubuntu-24.04
        if: always()
        needs: [validate, sast, sca, dast]
        steps:
            - uses: actions/checkout@v4
            - name: Download raw evidence
              uses: actions/download-artifact@v4
              with:
                  pattern: raw-*-${{ inputs.group }}
                  path: downloaded
                  merge-multiple: false
              continue-on-error: true
            - name: Build final documents
              env:
                  GROUP: ${{ inputs.group }}
                  VALIDATE_STATUS: ${{ needs.validate.result }}
                  SAST_STATUS: ${{ needs.sast.result }}
                  SCA_STATUS: ${{ needs.sca.result }}
                  DAST_STATUS: ${{ needs.dast.result }}
              run: |
                  python3 - <<'PY'
                  import os, json
                  from pathlib import Path
                  from datetime import datetime, timezone

                  source, target = Path("downloaded"), Path("results")
                  target.mkdir(exist_ok=True)
                  group = os.environ["GROUP"]
                  run = {"group": group, "run_id": os.getenv("GITHUB_RUN_ID"),
                         "run_attempt": os.getenv("GITHUB_RUN_ATTEMPT"), "commit": os.getenv("GITHUB_SHA"),
                         "ref": os.getenv("GITHUB_REF"), "generated_at_utc": datetime.now(timezone.utc).isoformat()}
                  jobs = {"validate": ("VALIDATE", os.getenv("VALIDATE_STATUS", "unknown")),
                          "sast": ("SAST", os.getenv("SAST_STATUS", "unknown")),
                          "sca": ("SCA", os.getenv("SCA_STATUS", "unknown")),
                          "dast": ("DAST", os.getenv("DAST_STATUS", "unknown"))}

                  def read(path):
                      data = path.read_bytes()
                      try: return {"format": "json", "content": json.loads(data.decode())}
                      except Exception: return {"format": "text", "content": data.decode(errors="replace")}
                  def content(files, name):
                      return files.get(name, {}).get("content")
                  def exit_code(files, name):
                      value = content(files, name)
                      try: return int(value.strip())
                      except (ValueError, AttributeError): return None

                  docs = {}
                  configs = {
                    "validate": {"commands": ["npm ci", "npx prisma generate", "npm test", "npm run build"]},
                    "sast": {"image": "semgrep/semgrep:1.178.0", "configs": ["p/security-audit", "p/secrets", "p/owasp-top-ten", "p/javascript", "p/typescript", "p/nodejs", "p/jwt", "workflows_support/sast-rs01-rs07.rules.yml"]},
                    "sca": {"commands": ["npm audit --json", "npm audit --omit=dev --json"], "scope": ["all dependencies", "production dependencies"]},
                    "dast": {"zap_image": "ghcr.io/zaproxy/zaproxy:2.16.1", "target": "http://localhost:3000", "openapi": "http://localhost:3000/openapi.json", "complementary_tests": "workflows_support/dast-rs01-rs07.test.ts", "DAST_RATE_LIMIT_ATTEMPTS": "30"}
                  }

                  for job, (kind, status) in jobs.items():
                      folder = source / f"raw-{job}-{group}"
                      files = {str(p.relative_to(folder)): read(p) for p in sorted(folder.rglob("*")) if p.is_file()} if folder.exists() else {}
                      doc = {"metadata": {**run, "analysis_type": kind, "job_status": status, "runner": "ubuntu-24.04"},
                             "configuration": configs[job], "execution": {"job_status": status}, "raw_evidence": files}
                      if job == "validate":
                          doc["metadata"]["tool"] = "npm / Prisma / project tests"
                          doc["summary"] = {"evidence_files": len(files)}
                      elif job == "sast":
                          report = content(files, "sast-report.json") or {}
                          findings = report.get("results", []) if isinstance(report, dict) else []
                          severity = {}
                          for item in findings:
                              level = (item.get("extra") or {}).get("severity", "UNKNOWN")
                              severity[level] = severity.get(level, 0) + 1
                          code = exit_code(files, "sast-exit-code.txt")
                          doc["metadata"].update(tool="Semgrep", tool_version=content(files, "semgrep-version.txt"))
                          doc["execution"].update(exit_code=code, status="completed" if code in (0, 1) else "incomplete_or_failed")
                          doc["summary"] = {"total_findings": len(findings), "native_severity_counts": severity}
                      elif job == "sca":
                          all_report = content(files, "sca-report-all.json") or {}
                          prod_report = content(files, "sca-report-production.json") or {}
                          def total(report):
                              return report.get("metadata", {}).get("vulnerabilities", {}).get("total") if isinstance(report, dict) else None
                          def severities(report):
                              values = report.get("metadata", {}).get("vulnerabilities", {}) if isinstance(report, dict) else {}
                              return {key: values.get(key, 0) for key in ("critical", "high", "moderate", "low", "info")}
                          doc["metadata"].update(tool="npm audit", node_version=content(files, "environment.txt"))
                          doc["execution"].update(all_exit_code=exit_code(files, "npm-audit-all-exit-code.txt"), production_exit_code=exit_code(files, "npm-audit-production-exit-code.txt"))
                          doc["summary"] = {"all_dependencies_total": total(all_report), "production_dependencies_total": total(prod_report), "all_dependencies_native_severity": severities(all_report), "production_dependencies_native_severity": severities(prod_report)}
                      else:
                          zap = content(files, "dast-report.json") or {}
                          sites = zap.get("site", []) if isinstance(zap, dict) else []
                          risks = {}
                          for site in sites:
                              for alert in site.get("alerts", []):
                                  risk = alert.get("riskdesc", "UNKNOWN")
                                  risks[risk] = risks.get(risk, 0) + 1
                          test_report = content(files, "dast-rs01-rs07-report.json") or {}
                          test_results = test_report.get("results", []) if isinstance(test_report, dict) else []
                          statuses = {}
                          for result in test_results:
                              value = result.get("status", "UNKNOWN")
                              statuses[value] = statuses.get(value, 0) + 1
                          doc["metadata"]["tools"] = ["OWASP ZAP", "RS01–RS07 complementary tests"]
                          doc["execution"].update(compose_exit_code=exit_code(files, "compose-up-exit-code.txt"), zap_exit_code=exit_code(files, "zap-exit-code.txt"), complementary_exit_code=exit_code(files, "complementary-exit-code.txt"), status="completed" if "dast-report.json" in files and "dast-rs01-rs07-report.json" in files else "incomplete_or_failed")
                          doc["summary"] = {"zap_alert_instances": sum(len(s.get("alerts", [])) for s in sites), "zap_native_risk_counts": risks, "complementary_test_status_counts": statuses, "note": "ZAP alerts and complementary test outcomes are kept separate."}
                      docs[job] = doc
                      (target / f"evidence-{job}.json").write_text(json.dumps(doc, ensure_ascii=False, indent=2), encoding="utf-8")

                  # O relatório é por grupo. A redução B/A é calculada na comparação dos dois relatórios.
                  lines = [f"# Relatório de análise — Grupo {group}", "",
                           f"- **Execução:** `{run['run_id']}` (tentativa `{run['run_attempt']}`)",
                           f"- **Commit:** `{run['commit']}`", f"- **Referência:** `{run['ref']}`",
                           f"- **Gerado (UTC):** `{run['generated_at_utc']}`", "",
                           "## Resumo dos resultados", ""]
                  for job, title in [("validate", "Validação"), ("sast", "SAST — Semgrep"), ("sca", "SCA — npm audit"), ("dast", "DAST — OWASP ZAP e testes complementares RS01–RS07")]:
                      doc, summary = docs[job], docs[job].get("summary", {})
                      lines += [f"### {title}", "", f"- **Status do job:** `{jobs[job][1]}`"]
                      if job == "validate":
                          lines.append(f"- **Arquivos de evidência capturados:** {summary['evidence_files']}")
                      elif job == "sast":
                          lines += [f"- **Quantidade de achados:** {summary.get('total_findings', 'não disponível')}", "- **Severidades nativas:** " + (", ".join(f"`{k}`: {v}" for k, v in summary.get("native_severity_counts", {}).items()) or "não disponível")]
                      elif job == "sca":
                          lines += [f"- **Achados — todas as dependências:** {summary.get('all_dependencies_total', 'não disponível')}", f"- **Achados — produção:** {summary.get('production_dependencies_total', 'não disponível')}", "- **Severidades nativas:** " + (", ".join(f"`{k}`: {v}" for k, v in summary.get("all_dependencies_native_severity", {}).items()) or "não disponível")]
                      else:
                          lines += [f"- **Alertas OWASP ZAP:** {summary.get('zap_alert_instances', 'não disponível')}", "- **Riscos nativos do ZAP:** " + (", ".join(f"`{k}`: {v}" for k, v in summary.get("zap_native_risk_counts", {}).items()) or "não disponível"), "- **Resultados RS01–RS07:** " + (", ".join(f"`{k}`: {v}" for k, v in summary.get("complementary_test_status_counts", {}).items()) or "não disponível"), "- As contagens do ZAP e dos testes complementares permanecem separadas."]
                          results = (content(docs[job]["raw_evidence"], "dast-rs01-rs07-report.json") or {}).get("results", [])
                          if results:
                              lines += ["", "| Teste | Resultado | Detalhes |", "|---|---|---|"]
                              for result in results:
                                  cells = [str(result.get(k, "—")).replace("|", "\\|").replace("\n", " ") for k in ("id", "status", "details")]
                                  lines.append("| " + " | ".join(cells) + " |")
                      lines.append("")
                  lines += ["## Análise quantitativa", "",
                            "Este relatório apresenta um único grupo. A redução percentual geral e específica de SAST, DAST e SCA do Grupo B em relação ao Grupo A deve ser calculada após reunir os relatórios dos dois grupos.",
                            "O total geral deve seguir uma regra de contagem documentada; alertas do ZAP e resultados RS01–RS07 não são somados automaticamente.", "",
                            "## Análise de severidade", "",
                            "As severidades são apresentadas conforme a classificação nativa de cada ferramenta, sem conversão para uma escala comum.", "",
                            "## Observações e limitações", "",
                            "- Etapa não executada ou relatório ausente não significa ausência de vulnerabilidades.",
                            "- Os resultados dos testes complementares não são automaticamente equivalentes a alertas do ZAP.",
                            "- Configurações, versões, relatórios originais, logs, códigos de saída e hashes disponíveis estão preservados nos JSONs correspondentes.", ""]
                  (target / "analysis.md").write_text("\n".join(lines), encoding="utf-8")
                  PY
            - name: Upload final documents
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: experiment-results-${{ inputs.group }}
                  path: results/
                  if-no-files-found: warn
                  retention-days: 90
