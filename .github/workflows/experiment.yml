name: Authentication API Experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. Valida a aplicação e registra as versões/arquivos usados no experimento.
  validate:
    name: Validate Application
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Validate application
        env:
          DATABASE_URL: "file:./test.db"
        run: |
          npm ci
          npx prisma generate
          npm test -- --exclude "workflows_support/dast-rs01-rs07.test.ts"
          npm run build

      # Guarda metadados e hashes para identificar exatamente a execução do experimento.
      - name: Record run metadata
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          {
            printf 'run_id=%s\nrun_attempt=%s\ncommit=%s\nrunner_os=%s\n' \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$RUNNER_OS"
            printf 'node=%s\nnpm=%s\ndocker=%s\n' \
              "$(node --version 2>&1 || true)" \
              "$(npm --version 2>&1 || true)" \
              "$(docker --version 2>&1 || true)"
            printf 'checkout_action=actions/checkout@v4\nsetup_node_action=actions/setup-node@v4\nupload_artifact_action=actions/upload-artifact@v4\n'
          } > evidence/environment.txt
          for file in \
            package.json package-lock.json AGENTS.md .github/workflows/experiment.yml \
            workflows_support/sast-rs01-rs07.rules.yml \
            workflows_support/dast-rs01-rs07.test.ts \
            docker-compose.yml compose.yml Dockerfile
          do
            if [ -f "$file" ]; then sha256sum "$file" >> evidence/input-sha256.txt; fi
          done

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 90

  # 2. SAST: mantém relatório completo e inventário com regra, arquivo, linha e severidade.
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        shell: bash
        run: |
          mkdir -p evidence
          set +e
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/evidence:/reports:rw" -w /src \
            semgrep/semgrep:1.178.0 semgrep scan \
            --config p/security-audit --config p/secrets --config p/owasp-top-ten \
            --config p/javascript --config p/typescript --config p/nodejs --config p/jwt \
            --config /src/workflows_support/sast-rs01-rs07.rules.yml \
            --json --output /reports/sast-report.json . > evidence/sast-console.txt 2>&1
          code=$?
          echo "$code" > evidence/sast-exit-code.txt
          set -e
          cat evidence/sast-console.txt
          # Código 1 significa que há achados; códigos diferentes de 0/1 indicam erro de execução.
          if [ "$code" != "0" ] && [ "$code" != "1" ]; then
            echo "Semgrep não concluiu corretamente (código $code)." >&2
            exit 1
          fi

      - name: Prepare SAST evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          # TSV facilita filtrar manualmente achados de testes/infra sem apagar o relatório bruto.
          if [ -f evidence/sast-report.json ]; then
            jq -r '.results[]? | [.check_id, .path, (.start.line // 0 | tostring), (.extra.severity // "UNKNOWN"), (.extra.message // "")] | @tsv' \
              evidence/sast-report.json > evidence/sast-findings.tsv || true
          fi
          docker run --rm semgrep/semgrep:1.178.0 semgrep --version > evidence/semgrep-version.txt 2>&1 || true
          cp workflows_support/sast-rs01-rs07.rules.yml evidence/ 2>/dev/null || true
          cp .github/workflows/experiment.yml evidence/experiment.yml 2>/dev/null || true
          {
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
          } >> evidence/environment.txt

      - name: Upload SAST evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 90

  # 3. SCA: relatório geral inclui dependências de desenvolvimento; o segundo cobre produção.
  sca:
    name: SCA (npm audit)
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies and preserve evidence
        shell: bash
        run: |
          mkdir -p evidence
          # npm audit pode retornar código diferente de zero por vulnerabilidades; os relatórios são preservados.
          set +e
          npm audit --json > evidence/sca-report-all.json 2> evidence/sca-stderr-all.txt
          echo "$?" > evidence/npm-audit-all-exit-code.txt
          npm audit --omit=dev --json > evidence/sca-report-production.json 2> evidence/sca-stderr-production.txt
          echo "$?" > evidence/npm-audit-production-exit-code.txt
          set -e
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo "node=$(node --version 2>&1 || true)"
            echo "npm=$(npm --version 2>&1 || true)"
            echo "audit_all=npm audit --json"
            echo "audit_production=npm audit --omit=dev --json"
          } > evidence/environment.txt
          cp package.json package-lock.json evidence/
          sha256sum package.json package-lock.json > evidence/dependency-files-sha256.txt

      - name: Upload SCA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 90

  # 4. DAST: inicia a API, obtém o OpenAPI em execução, executa ZAP e os testes complementares.
  dast:
    name: DAST (OWASP ZAP + Complementary Tests)
    runs-on: ubuntu-24.04
    needs: validate
    timeout-minutes: 30
    env:
      JWT_ACCESS_SECRET: "dast-test-access-secret-CHANGE-ME-123456789"
      JWT_REFRESH_SECRET: "dast-test-refresh-secret-CHANGE-ME-123456789"

    steps:
      - uses: actions/checkout@v4

      - name: Start API and prepare OpenAPI
        shell: bash
        env:
          DAST_BASE_URL: http://localhost:3000
          DAST_REPORT_PATH: ${{ runner.temp }}/dast-evidence/dast-rs01-rs07-report.json
          DAST_RATE_LIMIT_ATTEMPTS: "30"
        run: |
          mkdir -p "$RUNNER_TEMP/dast-evidence"
          EVIDENCE="$RUNNER_TEMP/dast-evidence"

          # Códigos 125 indicam que a etapa não foi executada; evita confundir ausência de arquivo com falha silenciosa.
          echo "125" > "$EVIDENCE/zap-exit-code.txt"
          echo "125" > "$EVIDENCE/complementary-exit-code.txt"
          echo "not-run" > "$EVIDENCE/openapi-status.txt"

          # Registra o resultado da inicialização para diferenciar erro de infraestrutura de achados de segurança.
          set +e
          docker compose up --build -d > "$EVIDENCE/compose-up.txt" 2>&1
          compose_code=$?
          echo "$compose_code" > "$EVIDENCE/compose-up-exit-code.txt"
          set -e
          cat "$EVIDENCE/compose-up.txt"

          if [ "$compose_code" -eq 0 ]; then
            # Aguarda a API e valida a especificação real antes de iniciar o ZAP.
            for attempt in {1..30}; do
              if curl -fsS http://localhost:3000/health >/dev/null && \
                 curl -fsS http://localhost:3000/openapi.json -o "$EVIDENCE/openapi-runtime.json" && \
                 jq -e 'type == "object" and .openapi != null and (.paths | type == "object")' "$EVIDENCE/openapi-runtime.json" >/dev/null; then
                if jq 'if (.servers | type) == "array" and (.servers | length) > 0 then .servers[0].url = "http://host.docker.internal:3000" | .servers = [ .servers[0] ] else .servers = [{"url":"http://host.docker.internal:3000"}] end' \
                  "$EVIDENCE/openapi-runtime.json" > "$EVIDENCE/openapi-for-zap.json"; then
                  echo "prepared" > "$EVIDENCE/openapi-status.txt"
                else
                  echo "Falha ao transformar OpenAPI para o ZAP." > "$EVIDENCE/openapi-error.txt"
                  echo "prepare-failed" > "$EVIDENCE/openapi-status.txt"
                  rm -f "$EVIDENCE/openapi-for-zap.json"
                fi
                break
              fi
              sleep 2
            done
            if [ ! -f "$EVIDENCE/openapi-for-zap.json" ]; then
              {
                echo "OpenAPI não ficou disponível ou inválido após 30 tentativas."
                echo "Última resposta /health:"
                curl -sS -i --max-time 5 http://localhost:3000/health 2>&1 || true
                echo "Última resposta /openapi.json:"
                curl -sS -i --max-time 5 http://localhost:3000/openapi.json 2>&1 || true
                echo "Estado dos containers:"
                docker compose ps -a 2>&1 || true
                echo "Logs da aplicação:"
                docker compose logs --no-color --tail=200 2>&1 || true
              } > "$EVIDENCE/openapi-error.txt"
              echo "unavailable-or-invalid" > "$EVIDENCE/openapi-status.txt"
            fi
          else
            {
              echo "docker compose up falhou com código $compose_code."
              docker compose ps -a 2>&1 || true
              docker compose logs --no-color --tail=200 2>&1 || true
            } > "$EVIDENCE/compose-diagnostics.txt"
          fi

      - name: Run ZAP and complementary tests
        if: always()
        shell: bash
        env:
          DAST_BASE_URL: http://localhost:3000
          DAST_REPORT_PATH: ${{ runner.temp }}/dast-evidence/dast-rs01-rs07-report.json
          DAST_RATE_LIMIT_ATTEMPTS: "30"
        run: |
          EVIDENCE="$RUNNER_TEMP/dast-evidence"
          mkdir -p "$EVIDENCE"

          # ZAP e testes complementares podem falhar, mas os códigos e logs ficam guardados.
          if [ -f "$EVIDENCE/openapi-for-zap.json" ]; then
            set +e

            # Executa o ZAP sem montar o diretório de relatórios do host no container.
            docker run --name zap-dast --add-host=host.docker.internal:host-gateway \
              -v "$EVIDENCE:/zap/wrk:ro" \
              ghcr.io/zaproxy/zaproxy:2.16.1 zap-api-scan.py \
              -t /zap/wrk/openapi-for-zap.json -f openapi \
              -r /tmp/dast-report.html \
              -J /tmp/dast-report.json \
              -w /tmp/dast-report.md \
              -I > "$EVIDENCE/zap-console.txt" 2>&1

            ZAP_EXIT_CODE=$?
            echo "$ZAP_EXIT_CODE" > "$EVIDENCE/zap-exit-code.txt"

            # Recupera os relatórios antes de remover o container.
            if docker container inspect zap-dast >/dev/null 2>&1; then
              for REPORT in dast-report.html dast-report.json dast-report.md; do
                docker cp "zap-dast:/tmp/$REPORT" "$EVIDENCE/$REPORT"
                COPY_EXIT_CODE=$?
                if [ "$COPY_EXIT_CODE" -ne 0 ]; then
                  echo "Falha ao copiar o relatório $REPORT do container ZAP." \
                    >> "$EVIDENCE/zap-console.txt"
                fi
              done
              docker rm -f zap-dast >/dev/null 2>&1
            fi

            cat "$EVIDENCE/zap-console.txt"

            # Executa os testes complementares independentemente do resultado do ZAP.
            node --experimental-strip-types workflows_support/dast-rs01-rs07.test.ts \
              > "$EVIDENCE/complementary-console.txt" 2>&1
            echo "$?" > "$EVIDENCE/complementary-exit-code.txt"

            set -e
            cat "$EVIDENCE/complementary-console.txt"
          else
            if [ ! -f "$EVIDENCE/openapi-error.txt" ]; then
              echo "OpenAPI ausente ou inválido; ZAP e testes complementares não executados." \
                > "$EVIDENCE/openapi-error.txt"
            fi
            echo "125" > "$EVIDENCE/zap-exit-code.txt"
            echo "125" > "$EVIDENCE/complementary-exit-code.txt"
            echo "skipped" > "$EVIDENCE/zap-status.txt"
            echo "skipped" > "$EVIDENCE/complementary-status.txt"
          fi

      - name: Record DAST metadata and hashes
        if: always()
        shell: bash
        run: |
          EVIDENCE="$RUNNER_TEMP/dast-evidence"
          mkdir -p "$EVIDENCE"
          # Registra versões, arquivos de configuração e hashes para reproduzir a execução.
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "commit=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "node=$(node --version 2>&1 || true)"
            echo "npm=$(npm --version 2>&1 || true)"
            echo "docker=$(docker --version 2>&1 || true)"
            echo "zap_image=ghcr.io/zaproxy/zaproxy:2.16.1"
            docker image inspect ghcr.io/zaproxy/zaproxy:2.16.1 --format '{{index .RepoDigests 0}}' 2>/dev/null || true
          } > "$EVIDENCE/environment.txt"
          cp .github/workflows/experiment.yml "$EVIDENCE/experiment.yml" 2>/dev/null || true
          cp workflows_support/dast-rs01-rs07.test.ts "$EVIDENCE/" 2>/dev/null || true
          cp docker-compose.yml "$EVIDENCE/" 2>/dev/null || cp compose.yml "$EVIDENCE/" 2>/dev/null || true
          [ ! -f Dockerfile ] || cp Dockerfile "$EVIDENCE/"
          find "$EVIDENCE" -maxdepth 1 -type f ! -name evidence-sha256.txt -print0 | sort -z | xargs -0 -r sha256sum > "$EVIDENCE/evidence-sha256.txt"

      # Envia as evidências mesmo quando a API, o ZAP ou um teste falha.
      - name: Upload DAST evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-evidence
          path: ${{ runner.temp }}/dast-evidence/
          if-no-files-found: warn
          retention-days: 90

      # Falha após o upload se uma etapa essencial não foi executada ou terminou com erro.
      - name: Check DAST execution status
        if: always()
        shell: bash
        run: |
          EVIDENCE="$RUNNER_TEMP/dast-evidence"
          errors=0
          for file in compose-up-exit-code.txt zap-exit-code.txt complementary-exit-code.txt; do
            path="$EVIDENCE/$file"
            if [ ! -f "$path" ]; then
              echo "Evidência ausente: $file"
              errors=1
            elif [ "$(cat "$path")" != "0" ]; then
              echo "Etapa falhou ou não foi executada: $file (código $(cat "$path"))"
              errors=1
            fi
          done
          if [ ! -f "$EVIDENCE/openapi-for-zap.json" ]; then
            echo "OpenAPI não preparado; veja openapi-error.txt, compose-diagnostics.txt e os logs preservados no artefato."
            errors=1
          fi
          exit "$errors"

      - name: Stop API
        if: always()
        run: docker compose down --volumes --remove-orphans
