
name: Authentication API Experiment

on:
    workflow_dispatch:
        inputs:
            experiment_group:
                description: 'Grupo do Experimento que Será Executado'
                type: choice
                options:
                    - A
                    - B
                required: true
                default: A

            delete_temp_artifacts:
                description: 'Excluir Artefatos Temporários Após Final da Análise'
                type: boolean
                required: true
                default: true

permissions:
    contents: read

jobs:
    # 1. Validação da aplicação
    validate:
        name: Validate - Grupo ${{ inputs.experiment_group }}
        runs-on: ubuntu-24.04

        env:
            DATABASE_URL: 'file:./test.db'
            EVIDENCE_DIR: evidence/validate

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22.14.0'
                  cache: npm

            - name: Initialize validation evidence
              shell: bash
              run: |
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"
                  mkdir -p "$EVIDENCE_DIR"

                  {
                    echo "experiment_group=${{ inputs.experiment_group }}"
                    echo "run_id=${GITHUB_RUN_ID}"
                    echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
                    echo "commit=${GITHUB_SHA}"
                    echo "event=${GITHUB_EVENT_NAME}"
                    echo "node_version=$(node --version)"
                    echo "npm_version=$(npm --version)"
                  } > "$EVIDENCE_DIR/metadata.txt"

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma Client
              run: npx prisma generate

            - name: Run tests
              id: tests
              shell: bash
              run: |
                  set +e
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"
                  npm test 2>&1 | tee "$EVIDENCE_DIR/tests.log"
                  status=${PIPESTATUS[0]}
                  echo "tests_exit_code=$status" >> "$EVIDENCE_DIR/metadata.txt"
                  exit "$status"

            - name: Build application
              id: build
              if: always() && steps.tests.outcome == 'success'
              shell: bash
              run: |
                  set +e
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"
                  npm run build 2>&1 | tee "$EVIDENCE_DIR/build.log"
                  status=${PIPESTATUS[0]}
                  echo "build_exit_code=$status" >> "$EVIDENCE_DIR/metadata.txt"
                  exit "$status"

            - name: Upload validation evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: validate-evidence-${{ inputs.experiment_group }}
                  path: evidence/validate/
                  if-no-files-found: warn
                  retention-days: 14

    # 2. Análise Estática do Código-Fonte (SAST - Semgrep)
    sast:
        name: SAST - Grupo ${{ inputs.experiment_group }}
        runs-on: ubuntu-24.04
        needs: validate

        env:
            SAST_PLAN: workflows_support/sast/sast-rs01-rs07.rules.yml
            EVIDENCE_DIR: evidence/sast

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Initialize SAST evidence
              shell: bash
              run: |
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"
                  mkdir -p "$EVIDENCE_DIR"

                  {
                    echo "experiment_group=${{ inputs.experiment_group }}"
                    echo "run_id=${GITHUB_RUN_ID}"
                    echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
                    echo "commit=${GITHUB_SHA}"
                    echo "event=${GITHUB_EVENT_NAME}"
                    echo "semgrep_image=semgrep/semgrep:1.178.0"
                  } > "$EVIDENCE_DIR/metadata.txt"

            - name: Run Semgrep
              id: semgrep
              shell: bash
              run: |
                  set +e
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"

                  docker run --rm \
                    -v "$GITHUB_WORKSPACE:/src:ro" \
                    -v "$EVIDENCE_DIR:/reports" \
                    semgrep/semgrep:1.178.0 \
                    semgrep scan \
                      --config p/security-audit \
                      --config p/secrets \
                      --config p/owasp-top-ten \
                      --config p/javascript \
                      --config p/typescript \
                      --config p/nodejs \
                      --config p/jwt \
                      --config "/src/$SAST_PLAN" \
                      --json \
                      --output /reports/semgrep-report.json \
                      --exit-code 0 \
                      /src 2>&1 | tee "$EVIDENCE_DIR/semgrep.log"

                  status=${PIPESTATUS[0]}
                  echo "semgrep_exit_code=$status" >> "$EVIDENCE_DIR/metadata.txt"

                  if [ "$status" -ne 0 ]; then
                    echo "Falha na execução do Semgrep." \
                      | tee "$EVIDENCE_DIR/error.txt"
                    exit "$status"
                  fi

                  if [ ! -s "$EVIDENCE_DIR/semgrep-report.json" ]; then
                    echo "O Semgrep não gerou o relatório JSON esperado." \
                      | tee "$EVIDENCE_DIR/error.txt"
                    exit 1
                  fi

            - name: Upload SAST evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: sast-evidence-${{ inputs.experiment_group }}
                  path: evidence/sast/
                  if-no-files-found: warn
                  retention-days: 14

    # 3. Análise de Dependências Diretas e Transitivas (SCA - npm audit)
    sca:
        name: SCA - Grupo ${{ inputs.experiment_group }}
        runs-on: ubuntu-24.04
        needs: validate

        env:
            EVIDENCE_DIR: evidence/sca

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22.14.0'
                  cache: npm

            - name: Initialize SCA evidence
              shell: bash
              run: |
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"
                  mkdir -p "$EVIDENCE_DIR"

                  {
                    echo "experiment_group=${{ inputs.experiment_group }}"
                    echo "run_id=${GITHUB_RUN_ID}"
                    echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
                    echo "commit=${GITHUB_SHA}"
                    echo "event=${GITHUB_EVENT_NAME}"
                    echo "node_version=$(node --version)"
                    echo "npm_version=$(npm --version)"
                  } > "$EVIDENCE_DIR/metadata.txt"

            - name: Install dependencies
              run: npm ci

            - name: Audit all dependencies
              id: audit_all
              shell: bash
              run: |
                  set +e
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"

                  npm audit --json \
                    > "$EVIDENCE_DIR/npm-audit-all.json" \
                    2> "$EVIDENCE_DIR/npm-audit-all.log"

                  status=$?
                  echo "audit_all_exit_code=$status" \
                    >> "$EVIDENCE_DIR/metadata.txt"

                  if [ "$status" -ne 0 ] && \
                    ! jq -e '.auditReportVersion and .metadata.vulnerabilities' \
                      "$EVIDENCE_DIR/npm-audit-all.json" >/dev/null 2>&1; then
                    echo "Falha na execução do npm audit para todas as dependências." \
                      | tee "$EVIDENCE_DIR/error-all.txt"
                    exit 1
                  fi

            - name: Audit production dependencies
              id: audit_prod
              shell: bash
              run: |
                  set +e
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"

                  npm audit --omit=dev --json \
                    > "$EVIDENCE_DIR/npm-audit-production.json" \
                    2> "$EVIDENCE_DIR/npm-audit-production.log"

                  status=$?
                  echo "audit_production_exit_code=$status" \
                    >> "$EVIDENCE_DIR/metadata.txt"

                  if [ "$status" -ne 0 ] && \
                    ! jq -e '.auditReportVersion and .metadata.vulnerabilities' \
                      "$EVIDENCE_DIR/npm-audit-production.json" >/dev/null 2>&1; then
                    echo "Falha na execução do npm audit para dependências de produção." \
                      | tee "$EVIDENCE_DIR/error-production.txt"
                    exit 1
                  fi

            - name: Upload SCA evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: sca-evidence-${{ inputs.experiment_group }}
                  path: evidence/sca/
                  if-no-files-found: warn
                  retention-days: 14

    # 4. Análise Dinâmica da Aplicação (DAST - OWASP ZAP)
    dast:
        name: DAST - Grupo ${{ inputs.experiment_group }}
        runs-on: ubuntu-24.04
        needs: validate
        timeout-minutes: 30

        env:
            JWT_ACCESS_SECRET: 'dast-test-access-secret-CHANGE-ME-123456789'
            JWT_REFRESH_SECRET: 'dast-test-refresh-secret-CHANGE-ME-123456789'
            DAST_CONFIG_DIR: workflows_support/dast
            DAST_PLAN: workflows_support/dast/dast-rs01-rs07.rules.yml
            DAST_BASE_URL: http://127.0.0.1:3000
            DAST_IMAGE: authentication-api:dast-${{ inputs.experiment_group }}
            EVIDENCE_DIR: evidence/dast

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Initialize DAST evidence
              shell: bash
              run: |
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"
                  mkdir -p "$EVIDENCE_DIR"

                  {
                    echo "experiment_group=${{ inputs.experiment_group }}"
                    echo "run_id=${GITHUB_RUN_ID}"
                    echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
                    echo "commit=${GITHUB_SHA}"
                    echo "event=${GITHUB_EVENT_NAME}"
                    echo "zap_image=zaproxy/zap-stable"
                    echo "dast_image=$DAST_IMAGE"
                    echo "dast_base_url=$DAST_BASE_URL"
                  } > "$EVIDENCE_DIR/metadata.txt"

            - name: Build application Docker image
              id: build
              shell: bash
              run: |
                  set -o pipefail
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"
                  docker build --tag "$DAST_IMAGE" . \
                    2>&1 | tee "$EVIDENCE_DIR/docker-build.log"
                  echo "docker_build_exit_code=${PIPESTATUS[0]}" \
                    >> "$EVIDENCE_DIR/metadata.txt"

            - name: Start application
              id: app
              shell: bash
              run: |
                  set -euo pipefail
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"

                  docker run -d \
                    --name dast-api \
                    --publish 3000:3000 \
                    --env NODE_ENV=test \
                    --env DATABASE_URL='file:./test.db' \
                    --env JWT_ACCESS_SECRET="$JWT_ACCESS_SECRET" \
                    --env JWT_REFRESH_SECRET="$JWT_REFRESH_SECRET" \
                    "$DAST_IMAGE" \
                    > "$EVIDENCE_DIR/container-id.txt"

            - name: Wait for application readiness
              id: readiness
              shell: bash
              run: |
                  set -u
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"
                  ready=false

                  for attempt in $(seq 1 60); do
                    status=$(curl -sS --max-time 3 \
                      -o "$EVIDENCE_DIR/readiness-response.txt" \
                      -w '%{http_code}' \
                      "$DAST_BASE_URL/health" 2>/dev/null || true)

                    if [[ "$status" =~ ^[0-9]{3}$ ]] &&
                       [ "$status" -ge 200 ] && [ "$status" -lt 500 ]; then
                      ready=true
                      break
                    fi

                    if [ "$(docker inspect -f '{{.State.Running}}' dast-api 2>/dev/null || echo false)" != "true" ]; then
                      break
                    fi

                    sleep 2
                  done

                  echo "application_ready=$ready" \
                    >> "$EVIDENCE_DIR/metadata.txt"

                  docker logs dast-api \
                    > "$EVIDENCE_DIR/application.log" 2>&1 || true

                  if [ "$ready" != "true" ]; then
                    echo "A aplicação não ficou disponível." \
                      | tee "$EVIDENCE_DIR/error.txt"
                    exit 1
                  fi

            - name: Run OWASP ZAP
              id: zap
              shell: bash
              run: |
                  set +e
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"

                  docker run --rm \
                    --network host \
                    --volume "$GITHUB_WORKSPACE:/zap/wrk:ro" \
                    --volume "$EVIDENCE_DIR:/zap/out:rw" \
                    --env DAST_BASE_URL="$DAST_BASE_URL" \
                    zaproxy/zap-stable \
                    zap.sh -cmd \
                      -autorun "/zap/wrk/$DAST_PLAN" \
                    2>&1 | tee "$EVIDENCE_DIR/zap.log"

                  status=${PIPESTATUS[0]}
                  echo "zap_exit_code=$status" \
                    >> "$EVIDENCE_DIR/metadata.txt"

                  if [ "$status" -ne 0 ]; then
                    echo "Falha na execução do OWASP ZAP (código $status)." \
                      | tee "$EVIDENCE_DIR/error.txt"
                    exit "$status"
                  fi

                  for report in zap-report.json zap-report.html; do
                    if [ ! -s "$EVIDENCE_DIR/$report" ]; then
                      echo "Relatório ausente ou vazio: $report" \
                        | tee -a "$EVIDENCE_DIR/error.txt"
                      exit 1
                    fi
                  done

                  echo "reports_validated=true" \
                    >> "$EVIDENCE_DIR/metadata.txt"

            - name: Collect DAST evidence
              if: always()
              shell: bash
              run: |
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"
                  docker logs dast-api \
                    > "$EVIDENCE_DIR/application.log" 2>&1 || true

                  docker rm -f dast-api >/dev/null 2>&1 || true
                  docker image rm "$DAST_IMAGE" >/dev/null 2>&1 || true

            - name: Upload DAST evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: dast-evidence-${{ inputs.experiment_group }}
                  path: evidence/dast/
                  if-no-files-found: warn
                  retention-days: 14

    # 5. Analysis: consolida os relatórios SAST, SCA e DAST.
    analysis:
        name: Consolidated Security Analysis
        runs-on: ubuntu-24.04
        needs: [sast, sca, dast]
        if: ${{ always() }}

        steps:
            - uses: actions/checkout@v4

            - name: Download security evidence
              uses: actions/download-artifact@v4
              with:
                  pattern: '*-evidence'
                  path: collected
                  merge-multiple: true

            - name: Generate consolidated analysis report
              shell: bash
              run: |
                  set -euo pipefail

                  mkdir -p analysis/reports
                  REPORTS="analysis/reports"
                  OUTPUT="analysis/analysis.md"

                  copy_report() {
                    local source="$1"
                    local target="$2"

                    if [ -s "$source" ] && jq -e . "$source" >/dev/null 2>&1; then
                      cp "$source" "$REPORTS/$target"
                      echo "Incluído: $target"
                    else
                      echo "Relatório ausente ou inválido: $source"
                    fi
                  }

                  copy_report collected/semgrep-report.json report-sast.json
                  copy_report collected/npm-audit-all.json report-sca-all.json
                  copy_report collected/npm-audit-production.json report-sca-production.json
                  copy_report collected/zap-report.json report-dast-zap.json
                  copy_report collected/dast-rs01-rs07-report.json report-dast-complementary.json

                  {
                    echo "# Relatório consolidado de segurança"
                    echo
                    echo "## Identificação da execução"
                    echo
                    echo "- Repositório: \`$GITHUB_REPOSITORY\`"
                    echo "- Execução: \`$GITHUB_RUN_ID\`"
                    echo "- Tentativa: \`$GITHUB_RUN_ATTEMPT\`"
                    echo "- Commit: \`$GITHUB_SHA\`"
                    echo "- Data UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
                    echo

                    echo "## SAST — Semgrep"
                    echo
                    if [ -s "$REPORTS/report-sast.json" ]; then
                      jq -r '
                        "| Métrica | Quantidade |",
                        "|---|---:|",
                        "| Achados | \((.results // []) | length) |",
                        "| Erros reportados | \((.errors // []) | length) |",
                        "",
                        "| Severidade | Quantidade |",
                        "|---|---:|",
                        ([.results[]?.extra.severity // "UNKNOWN"]
                          | sort | group_by(.)[]
                          | "| \(.[0]) | \(length) |")
                      ' "$REPORTS/report-sast.json"
                    else
                      echo "Relatório SAST ausente ou inválido."
                    fi
                    echo

                    echo "## SCA — npm audit"
                    echo
                    for file in report-sca-all.json report-sca-production.json; do
                      echo "### $file"
                      echo
                      if [ -s "$REPORTS/$file" ]; then
                        jq -r '
                          "| Severidade | Quantidade |",
                          "|---|---:|",
                          "| Crítica | \(.metadata.vulnerabilities.critical // 0) |",
                          "| Alta | \(.metadata.vulnerabilities.high // 0) |",
                          "| Moderada | \(.metadata.vulnerabilities.moderate // 0) |",
                          "| Baixa | \(.metadata.vulnerabilities.low // 0) |",
                          "| Informativa | \(.metadata.vulnerabilities.info // 0) |",
                          "",
                          "Dependências analisadas: \(.metadata.dependencies.total // 0)"
                        ' "$REPORTS/$file"
                      else
                        echo "Relatório ausente ou inválido."
                      fi
                      echo
                    done

                    echo "## DAST — OWASP ZAP"
                    echo
                    if [ -s "$REPORTS/report-dast-zap.json" ]; then
                      jq -r '
                        "| Métrica | Quantidade |",
                        "|---|---:|",
                        "| Alertas | \([.site[]?.alerts[]?] | length) |"
                      ' "$REPORTS/report-dast-zap.json"
                    else
                      echo "Relatório JSON do ZAP ausente ou inválido."
                    fi
                    echo

                    echo "## DAST — Testes complementares"
                    echo
                    if [ -s "$REPORTS/report-dast-complementary.json" ]; then
                      jq -r '
                        if (.summary | type) == "object" then
                          "| Resultado | Quantidade |",
                          "|---|---:|",
                          "| Aprovados | \(.summary.passed // 0) |",
                          "| Reprovados | \(.summary.failed // 0) |",
                          "| Não avaliados | \(.summary.notEvaluated // 0) |",
                          "| Erros de infraestrutura | \(.summary.infrastructureErrors // 0) |"
                        else
                          "O relatório não possui o campo summary esperado."
                        end
                      ' "$REPORTS/report-dast-complementary.json"
                    else
                      echo "Relatório complementar ausente ou inválido."
                    fi
                    echo

                    echo "## Limitações e interpretação"
                    echo
                    echo "- A ausência de relatório não significa ausência de vulnerabilidades."
                    echo "- Os achados devem ser interpretados conforme os critérios de cada ferramenta."
                    echo "- SAST, SCA e DAST são análises distintas; seus totais não devem ser somados automaticamente."
                    echo "- Os JSON originais preservam os detalhes para auditoria."
                    echo
                    echo "## Relatórios JSON incluídos"
                    echo
                    found=false
                    for file in "$REPORTS"/report-*.json; do
                      [ -f "$file" ] || continue
                      echo "- \`$(basename "$file")\`"
                      found=true
                    done
                    if [ "$found" = false ]; then
                      echo "Nenhum relatório JSON válido foi encontrado."
                    fi
                  } > "$OUTPUT"

                  cat "$OUTPUT"

            - name: Upload consolidated analysis
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: analysis-evidence
                  path: |
                      analysis/analysis.md
                      analysis/reports/report-*.json
                  if-no-files-found: warn
                  retention-days: 90
