name: Authentication API Experiment

on:
    workflow_dispatch:
        inputs:
            experiment_group:
                description: 'Grupo do Experimento que Será Executado'
                type: choice
                options:
                    - A
                    - B
                required: true
                default: A

            delete_temp_artifacts:
                description: 'Excluir Artefatos Temporários Após Final da Análise'
                type: boolean
                required: true
                default: true

permissions:
    contents: read

jobs:
    # 1. Validação da aplicação
    validate:
        name: Validate - Grupo ${{ inputs.experiment_group }}
        runs-on: ubuntu-24.04

        env:
            DATABASE_URL: 'file:./test.db'
            EVIDENCE_DIR: evidence/validate

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22.14.0'
                  cache: npm

            - name: Initialize validation evidence
              shell: bash
              run: |
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"
                  mkdir -p "$EVIDENCE_DIR"

                  {
                    echo "experiment_group=${{ inputs.experiment_group }}"
                    echo "run_id=${GITHUB_RUN_ID}"
                    echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
                    echo "commit=${GITHUB_SHA}"
                    echo "event=${GITHUB_EVENT_NAME}"
                    echo "node_version=$(node --version)"
                    echo "npm_version=$(npm --version)"
                  } > "$EVIDENCE_DIR/metadata.txt"

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma Client
              run: npx prisma generate

            - name: Run tests
              id: tests
              shell: bash
              run: |
                  set +e
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"
                  npm test 2>&1 | tee "$EVIDENCE_DIR/tests.log"
                  status=${PIPESTATUS[0]}
                  echo "tests_exit_code=$status" >> "$EVIDENCE_DIR/metadata.txt"
                  exit "$status"

            - name: Build application
              id: build
              if: always() && steps.tests.outcome == 'success'
              shell: bash
              run: |
                  set +e
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"
                  npm run build 2>&1 | tee "$EVIDENCE_DIR/build.log"
                  status=${PIPESTATUS[0]}
                  echo "build_exit_code=$status" >> "$EVIDENCE_DIR/metadata.txt"
                  exit "$status"

            - name: Upload validation evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: validate-evidence-${{ inputs.experiment_group }}
                  path: evidence/validate/
                  if-no-files-found: warn
                  retention-days: 14

    # 2. Análise Estática do Código-Fonte (SAST - Semgrep)
    sast:
        name: SAST - Grupo ${{ inputs.experiment_group }}
        runs-on: ubuntu-24.04
        needs: validate

        env:
            SAST_PLAN: workflows_support/sast/sast.rules.yml
            SAST_IMAGE: semgrep/semgrep:1.178.0
            EVIDENCE_DIR: evidence/sast

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Initialize SAST evidence
              shell: bash
              run: |
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"
                  mkdir -p "$EVIDENCE_DIR"

                  {
                    echo "experiment_group=${{ inputs.experiment_group }}"
                    echo "run_id=${GITHUB_RUN_ID}"
                    echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
                    echo "commit=${GITHUB_SHA}"
                    echo "event=${GITHUB_EVENT_NAME}"
                    echo "semgrep_image=$SAST_IMAGE"
                    echo "custom_rules=$SAST_PLAN"
                  } > "$EVIDENCE_DIR/metadata.txt"

            - name: Validate custom Semgrep rules
              id: validate_rules
              shell: bash
              run: |
                  set +e
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"

                  if [ ! -s "$SAST_PLAN" ]; then
                    echo "Arquivo de regras ausente ou vazio: $SAST_PLAN" \
                      | tee "$EVIDENCE_DIR/rules-validation.log"
                    echo "rules_validation_exit_code=1" \
                      >> "$EVIDENCE_DIR/metadata.txt"
                    exit 1
                  fi

                  docker run --rm \
                    -v "$GITHUB_WORKSPACE:/src:ro" \
                    -w /src \
                    "$SAST_IMAGE" \
                    semgrep --validate --config "/src/$SAST_PLAN" \
                    > "$EVIDENCE_DIR/rules-validation.log" 2>&1

                  status=$?
                  echo "rules_validation_exit_code=$status" \
                    >> "$EVIDENCE_DIR/metadata.txt"

                  cat "$EVIDENCE_DIR/rules-validation.log"
                  exit "$status"

            - name: Run Semgrep
              id: semgrep
              shell: bash
              run: |
                  set +e
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"

                  docker run --rm \
                    -v "$GITHUB_WORKSPACE:/src:ro" \
                    -v "$EVIDENCE_DIR:/reports:rw" \
                    -w /src \
                    "$SAST_IMAGE" \
                    semgrep scan \
                      --config p/security-audit \
                      --config p/secrets \
                      --config p/owasp-top-ten \
                      --config p/javascript \
                      --config p/typescript \
                      --config p/nodejs \
                      --config p/jwt \
                      --config "/src/$SAST_PLAN" \
                      --exclude .github/ \
                      --exclude workflows_support/ \
                      --json \
                      --output /reports/semgrep-report.json \
                      /src \
                    > "$EVIDENCE_DIR/semgrep.log" 2>&1

                  status=$?
                  echo "semgrep_exit_code=$status" \
                    >> "$EVIDENCE_DIR/metadata.txt"

                  cat "$EVIDENCE_DIR/semgrep.log"

                  if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
                    echo "Falha na execução do Semgrep." \
                      | tee "$EVIDENCE_DIR/error.txt"
                    exit "$status"
                  fi

                  if [ ! -s "$EVIDENCE_DIR/semgrep-report.json" ]; then
                    echo "O Semgrep não gerou o relatório JSON esperado." \
                      | tee "$EVIDENCE_DIR/error.txt"
                    exit 1
                  fi

                  # Gera uma tabela auxiliar sem alterar o relatório original.
                  if command -v jq >/dev/null 2>&1; then
                    jq -r '
                      ["rule_id", "path", "line", "severity", "message"],
                      (.results[]? | [
                        .check_id,
                        .path,
                        (.start.line // 0),
                        (.extra.severity // "UNKNOWN"),
                        (.extra.message // "")
                      ]) | @tsv
                    ' "$EVIDENCE_DIR/semgrep-report.json" \
                      > "$EVIDENCE_DIR/semgrep-findings.tsv"
                  fi

            - name: Preserve SAST configuration and metadata
              if: always()
              shell: bash
              run: |
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"

                  cp "$SAST_PLAN" "$EVIDENCE_DIR/sast.rules.yml" \
                    2>/dev/null || true

                  {
                    echo "runner_os=$RUNNER_OS"
                    echo "runner_arch=$RUNNER_ARCH"
                    echo "docker_version=$(docker --version 2>&1)"
                    echo "semgrep_image=$SAST_IMAGE"
                    docker image inspect "$SAST_IMAGE" \
                      --format 'image_digest={{index .RepoDigests 0}}' \
                      2>/dev/null || true
                  } >> "$EVIDENCE_DIR/metadata.txt"

                  if [ -f "$EVIDENCE_DIR/semgrep-report.json" ]; then
                    sha256sum "$EVIDENCE_DIR/semgrep-report.json" \
                      > "$EVIDENCE_DIR/report-sha256.txt"
                  fi

            - name: Upload SAST evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: sast-evidence-${{ inputs.experiment_group }}
                  path: evidence/sast/
                  if-no-files-found: warn
                  retention-days: 90

    # 3. Análise de Dependências Diretas e Transitivas (SCA - npm audit)
    sca:
        name: SCA - Grupo ${{ inputs.experiment_group }}
        runs-on: ubuntu-24.04
        needs: validate

        env:
            EVIDENCE_DIR: evidence/sca

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22.14.0'
                  cache: npm

            - name: Initialize SCA evidence
              shell: bash
              run: |
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"
                  mkdir -p "$EVIDENCE_DIR"

                  {
                    echo "experiment_group=${{ inputs.experiment_group }}"
                    echo "run_id=${GITHUB_RUN_ID}"
                    echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
                    echo "commit=${GITHUB_SHA}"
                    echo "event=${GITHUB_EVENT_NAME}"
                    echo "node_version=$(node --version)"
                    echo "npm_version=$(npm --version)"
                  } > "$EVIDENCE_DIR/metadata.txt"

            - name: Install dependencies
              run: npm ci

            - name: Audit all dependencies
              id: audit_all
              shell: bash
              run: |
                  set +e
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"

                  npm audit --json \
                    > "$EVIDENCE_DIR/npm-audit-all.json" \
                    2> "$EVIDENCE_DIR/npm-audit-all.log"

                  status=$?
                  echo "audit_all_exit_code=$status" \
                    >> "$EVIDENCE_DIR/metadata.txt"

                  if [ "$status" -ne 0 ] && \
                    ! jq -e '.auditReportVersion and .metadata.vulnerabilities' \
                      "$EVIDENCE_DIR/npm-audit-all.json" >/dev/null 2>&1; then
                    echo "Falha na execução do npm audit para todas as dependências." \
                      | tee "$EVIDENCE_DIR/error-all.txt"
                    exit 1
                  fi

            - name: Audit production dependencies
              id: audit_prod
              shell: bash
              run: |
                  set +e
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"

                  npm audit --omit=dev --json \
                    > "$EVIDENCE_DIR/npm-audit-production.json" \
                    2> "$EVIDENCE_DIR/npm-audit-production.log"

                  status=$?
                  echo "audit_production_exit_code=$status" \
                    >> "$EVIDENCE_DIR/metadata.txt"

                  if [ "$status" -ne 0 ] && \
                    ! jq -e '.auditReportVersion and .metadata.vulnerabilities' \
                      "$EVIDENCE_DIR/npm-audit-production.json" >/dev/null 2>&1; then
                    echo "Falha na execução do npm audit para dependências de produção." \
                      | tee "$EVIDENCE_DIR/error-production.txt"
                    exit 1
                  fi

            - name: Upload SCA evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: sca-evidence-${{ inputs.experiment_group }}
                  path: evidence/sca/
                  if-no-files-found: warn
                  retention-days: 14

    # 4. Análise Dinâmica da Aplicação (DAST - OWASP ZAP)
    dast:
        name: DAST - Grupo ${{ inputs.experiment_group }}
        runs-on: ubuntu-24.04
        needs: validate
        timeout-minutes: 30

        env:
            JWT_ACCESS_SECRET: 'dast-test-access-secret-CHANGE-ME-123456789'
            JWT_REFRESH_SECRET: 'dast-test-refresh-secret-CHANGE-ME-123456789'
            DAST_CONFIG_DIR: workflows_support/dast
            DAST_PLAN: workflows_support/dast/dast.rules.yml
            DAST_BASE_URL: http://127.0.0.1:3000
            DAST_IMAGE: authentication-api:dast-${{ inputs.experiment_group }}
            EVIDENCE_DIR: evidence/dast

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Initialize DAST evidence
              shell: bash
              run: |
                  set -euo pipefail
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"
                  mkdir -p "$EVIDENCE_DIR"

                  {
                    echo "experiment_group=${{ inputs.experiment_group }}"
                    echo "run_id=${GITHUB_RUN_ID}"
                    echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
                    echo "commit=${GITHUB_SHA}"
                    echo "event=${GITHUB_EVENT_NAME}"
                    echo "zap_image=zaproxy/zap-stable"
                    echo "dast_image=$DAST_IMAGE"
                    echo "dast_base_url=$DAST_BASE_URL"
                  } > "$EVIDENCE_DIR/metadata.txt"

            - name: Build application Docker image
              id: build
              shell: bash
              run: |
                  set -euo pipefail
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"

                  set +e
                  docker build --tag "$DAST_IMAGE" . \
                    2>&1 | tee "$EVIDENCE_DIR/docker-build.log"
                  status=${PIPESTATUS[0]}
                  set -e

                  echo "docker_build_exit_code=$status" \
                    >> "$EVIDENCE_DIR/metadata.txt"
                  exit "$status"

            - name: Start application
              id: app
              shell: bash
              run: |
                  set -euo pipefail
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"

                  docker run -d \
                    --name dast-api \
                    --publish 3000:3000 \
                    --env NODE_ENV=test \
                    --env DATABASE_URL='file:./test.db' \
                    --env JWT_ACCESS_SECRET="$JWT_ACCESS_SECRET" \
                    --env JWT_REFRESH_SECRET="$JWT_REFRESH_SECRET" \
                    "$DAST_IMAGE" \
                    > "$EVIDENCE_DIR/container-id.txt"

            - name: Wait for application readiness
              id: readiness
              shell: bash
              run: |
                  set -euo pipefail
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"
                  ready=false

                  for attempt in $(seq 1 60); do
                    status=$(curl -sS --max-time 3 \
                      -o "$EVIDENCE_DIR/readiness-response.txt" \
                      -w '%{http_code}' \
                      "$DAST_BASE_URL/health" 2>/dev/null || true)

                    if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
                      ready=true
                      break
                    fi

                    if [ "$(docker inspect -f '{{.State.Running}}' dast-api 2>/dev/null || echo false)" != "true" ]; then
                      break
                    fi

                    sleep 2
                  done

                  echo "application_ready=$ready" \
                    >> "$EVIDENCE_DIR/metadata.txt"

                  docker logs dast-api \
                    > "$EVIDENCE_DIR/application.log" 2>&1 || true

                  if [ "$ready" != "true" ]; then
                    echo "A aplicação não ficou disponível em /health." \
                      | tee "$EVIDENCE_DIR/error.txt"
                    exit 1
                  fi

            - name: Verify DAST configuration and scripts
              shell: bash
              run: |
                  set -euo pipefail
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"

                  PLAN="$GITHUB_WORKSPACE/$DAST_PLAN"
                  SCRIPT="$GITHUB_WORKSPACE/$DAST_CONFIG_DIR/dast.script.js"

                  if [ ! -s "$PLAN" ]; then
                    echo "::error::Plano DAST ausente ou vazio: $PLAN"
                    exit 1
                  fi

                  if [ ! -s "$SCRIPT" ]; then
                    echo "::error::Script complementar ausente ou vazio: $SCRIPT"
                    exit 1
                  fi

                  if ! curl -fsS --max-time 5 \
                    "$DAST_BASE_URL/openapi.json" \
                    -o "$EVIDENCE_DIR/openapi.json"; then
                    echo "::error::Não foi possível obter /openapi.json."
                    exit 1
                  fi

                  if ! jq -e '
                    type == "object" and
                    (.paths | type == "object") and
                    (.paths | length > 0)
                  ' "$EVIDENCE_DIR/openapi.json" >/dev/null; then
                    echo "::error::O documento OpenAPI está inválido ou não contém rotas."
                    exit 1
                  fi

                  echo "Plano DAST, script e OpenAPI validados." \
                    | tee "$EVIDENCE_DIR/config-validation.txt"

            - name: Run OWASP ZAP
              id: zap
              shell: bash
              run: |
                  set -uo pipefail
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/evidence/dast"
                  mkdir -p "$EVIDENCE_DIR"
                  export EVIDENCE_DIR

                  chmod -R a+rwX "$EVIDENCE_DIR"

                  set +e
                  docker run --rm \
                    --network host \
                    --volume "$GITHUB_WORKSPACE:/zap/wrk:ro" \
                    --volume "$EVIDENCE_DIR:/zap/out:rw" \
                    zaproxy/zap-stable \
                    zap.sh -cmd \
                      -autorun "/zap/wrk/$DAST_PLAN" \
                    2>&1 | tee "$EVIDENCE_DIR/zap.log"

                  status=${PIPESTATUS[0]}
                  set -e

                  echo "zap_exit_code=$status" \
                    >> "$EVIDENCE_DIR/metadata.txt"

                  # Gera o resumo estruturado da suíte complementar.
                  node <<'NODE'
                  const fs = require('fs');
                  const path = require('path');

                  const dir = process.env.EVIDENCE_DIR;

                  if (!dir || !path.isAbsolute(dir)) {
                    throw new Error(
                      'EVIDENCE_DIR deve conter um caminho absoluto.'
                    );
                  }

                  fs.mkdirSync(dir, { recursive: true });

                  const logPath = path.join(dir, 'zap.log');
                  const outputPath = path.join(dir, 'dast-tests.json');

                  const log = fs.existsSync(logPath)
                    ? fs.readFileSync(logPath, 'utf8')
                    : '';

                  const tests = [];
                  const counts = {
                    PASS: 0,
                    FAIL: 0,
                    NOT_EVALUATED: 0,
                    ERROR: 0
                  };

                  const pattern =
                    /^\[DAST\]\s+(.+?)\s+=>\s+(PASS|FAIL|NOT_EVALUATED|ERROR)\b([^\r\n]*)/gm;

                  for (const match of log.matchAll(pattern)) {
                    const name = match[1].trim();
                    const status = match[2];
                    const detail = match[3].replace(/^;\s*/, '').trim();

                    tests.push({ name, status, detail });
                    counts[status]++;
                  }

                  const infraErrors = [
                    ...log.matchAll(
                      /^\[DAST\]\s+INFRA_ERROR:\s*(.*)$/gm
                    )
                  ];

                  for (const match of infraErrors) {
                    tests.push({
                      name: 'Execução da suíte complementar',
                      status: 'ERROR',
                      detail: match[1].trim()
                    });
                    counts.ERROR++;
                  }

                  const completed =
                    tests.length > 0 &&
                    counts.ERROR === 0 &&
                    counts.NOT_EVALUATED === 0 &&
                    infraErrors.length === 0;

                  const report = {
                    schemaVersion: 1,
                    completed,
                    total: tests.length,
                    counts,
                    tests
                  };

                  fs.writeFileSync(
                    outputPath,
                    JSON.stringify(report, null, 2) + '\n'
                  );

                  console.log(
                    `Testes complementares: total=${report.total}, ` +
                    `PASS=${counts.PASS}, FAIL=${counts.FAIL}, ` +
                    `NOT_EVALUATED=${counts.NOT_EVALUATED}, ERROR=${counts.ERROR}`
                  );
                  NODE

                  echo "dast_tests_total=$(jq -r '.total' "$EVIDENCE_DIR/dast-tests.json")" \
                    >> "$EVIDENCE_DIR/metadata.txt"
                  echo "dast_tests_pass=$(jq -r '.counts.PASS' "$EVIDENCE_DIR/dast-tests.json")" \
                    >> "$EVIDENCE_DIR/metadata.txt"
                  echo "dast_tests_fail=$(jq -r '.counts.FAIL' "$EVIDENCE_DIR/dast-tests.json")" \
                    >> "$EVIDENCE_DIR/metadata.txt"
                  echo "dast_tests_not_evaluated=$(jq -r '.counts.NOT_EVALUATED' "$EVIDENCE_DIR/dast-tests.json")" \
                    >> "$EVIDENCE_DIR/metadata.txt"
                  echo "dast_tests_error=$(jq -r '.counts.ERROR' "$EVIDENCE_DIR/dast-tests.json")" \
                    >> "$EVIDENCE_DIR/metadata.txt"

                  # Valida os relatórios gerados pelo ZAP.
                  validation_error=0

                  for report in zap-report.json zap-report.html; do
                    if [ ! -s "$EVIDENCE_DIR/$report" ]; then
                      echo "Relatório ausente ou vazio: $report" \
                        | tee -a "$EVIDENCE_DIR/error.txt"
                      validation_error=1
                    fi
                  done

                  if [ -s "$EVIDENCE_DIR/zap-report.json" ] &&
                    ! jq -e '
                      (.site | type == "array") and
                      (.site | length > 0) and
                      all(.site[]; (.alerts | type == "array"))
                    ' "$EVIDENCE_DIR/zap-report.json" >/dev/null; then
                    echo "Relatório JSON do ZAP inválido." \
                      | tee -a "$EVIDENCE_DIR/error.txt"
                    validation_error=1
                  fi

                  if ! jq -e '
                    (.schemaVersion == 1) and
                    (.completed == true) and
                    (.total > 0) and
                    (.counts | type == "object") and
                    (.tests | type == "array") and
                    ((.tests | length) == .total)
                  ' "$EVIDENCE_DIR/dast-tests.json" >/dev/null; then
                    echo "A suíte complementar está incompleta ou inconclusiva." \
                      | tee -a "$EVIDENCE_DIR/error.txt"
                    validation_error=1
                  fi

                  if [ "$status" -ne 0 ]; then
                    echo "Falha na execução do OWASP ZAP (código $status)." \
                      | tee -a "$EVIDENCE_DIR/error.txt"
                    exit "$status"
                  fi

                  if [ "$validation_error" -ne 0 ]; then
                    exit 1
                  fi

                  echo "reports_validated=true" \
                    >> "$EVIDENCE_DIR/metadata.txt"
                  echo "dast_test_suite_validated=true" \
                    >> "$EVIDENCE_DIR/metadata.txt"

            - name: Collect DAST evidence
              if: always()
              shell: bash
              run: |
                  EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR"
                  mkdir -p "$EVIDENCE_DIR"

                  docker logs dast-api \
                    > "$EVIDENCE_DIR/application.log" 2>&1 || true

                  docker rm -f dast-api >/dev/null 2>&1 || true
                  docker image rm "$DAST_IMAGE" >/dev/null 2>&1 || true

            - name: Upload DAST evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: dast-evidence-${{ inputs.experiment_group }}
                  path: evidence/dast/
                  if-no-files-found: warn
                  retention-days: 90

    # 5. Artefato Final de Análise SAST, DAST e SCA
    analysis:
        name: Consolidated Security Analysis
        runs-on: ubuntu-24.04
        needs: [validate, sast, sca, dast]
        if: ${{ always() }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Download security evidence
              uses: actions/download-artifact@v4
              with:
                  pattern: '*-evidence-*'
                  path: collected
                  merge-multiple: true

            - name: Inspect downloaded evidence
              shell: bash
              run: |
                  echo "Arquivos recebidos dos artefatos:"
                  if [ -d collected ]; then
                    find collected -type f -print | sort
                  else
                    echo "::warning::Diretório collected não foi criado."
                  fi

            - name: Generate consolidated analysis report
              shell: bash
              env:
                  EXPERIMENT_GROUP: ${{ inputs.experiment_group }}
                  VALIDATE_STATUS: ${{ needs.validate.result }}
                  SAST_STATUS: ${{ needs.sast.result }}
                  SCA_STATUS: ${{ needs.sca.result }}
                  DAST_STATUS: ${{ needs.dast.result }}
              run: |
                  set -euo pipefail

                  mkdir -p analysis/reports
                  REPORTS="analysis/reports"
                  OUTPUT="analysis/analysis.md"

                  copy_report() {
                    local source="$1"
                    local target="$2"

                    if [ -n "$source" ] && [ -s "$source" ] &&
                      jq -e 'type == "object"' "$source" >/dev/null 2>&1; then
                      cp "$source" "$REPORTS/$target"
                      echo "Incluído: $target"
                    else
                      echo "::warning::Relatório ausente ou inválido: $source"
                    fi
                  }

                  find_report() {
                    local filename="$1"
                    find collected -type f -name "$filename" -print -quit 2>/dev/null || true
                  }

                  copy_report "$(find_report semgrep-report.json)" sast-report.json
                  copy_report "$(find_report npm-audit-all.json)" sca-all-report.json
                  copy_report "$(find_report npm-audit-production.json)" sca-production-report.json
                  copy_report "$(find_report zap-report.json)" dast-zap-report.json
                  copy_report "$(find_report dast-tests.json)" dast-tests.json

                  {
                    echo "# Relatório consolidado de segurança"
                    echo
                    echo "## Identificação da execução"
                    echo
                    echo "- Repositório: \`$GITHUB_REPOSITORY\`"
                    echo "- Execução: \`$GITHUB_RUN_ID\`"
                    echo "- Tentativa: \`$GITHUB_RUN_ATTEMPT\`"
                    echo "- Commit: \`$GITHUB_SHA\`"
                    echo "- Grupo experimental: \`$EXPERIMENT_GROUP\`"
                    echo "- Data UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
                    echo
                    echo "## Estado dos jobs"
                    echo
                    echo "| Etapa | Resultado do GitHub Actions |"
                    echo "|---|---|"
                    echo "| Validação | $VALIDATE_STATUS |"
                    echo "| SAST | $SAST_STATUS |"
                    echo "| SCA | $SCA_STATUS |"
                    echo "| DAST | $DAST_STATUS |"
                    echo

                    echo "## SAST — Semgrep"
                    echo

                    if [ -s "$REPORTS/sast-report.json" ]; then
                      jq -r '
                        "| Métrica | Quantidade |",
                        "|---|---:|",
                        "| Achados reportados | \((.results // []) | length) |",
                        "| Erros reportados pela ferramenta | \((.errors // []) | length) |",
                        "",
                        "| Severidade original | Quantidade |",
                        "|---|---:|",
                        (
                          [.results[]?.extra.severity // "UNKNOWN"]
                          | sort
                          | group_by(.)
                          | .[]
                          | "| \(.[0]) | \(length) |"
                        )
                      ' "$REPORTS/sast-report.json"
                    else
                      echo "Relatório SAST ausente ou inválido; não foi possível determinar os totais."
                    fi

                    echo
                    echo "## SCA — npm audit"
                    echo

                    for file in sca-all-report.json sca-production-report.json; do
                      echo "### $file"
                      echo

                      if [ -s "$REPORTS/$file" ] &&
                        jq -e '.metadata.vulnerabilities | type == "object"' \
                          "$REPORTS/$file" >/dev/null 2>&1; then

                        jq -r '
                          "| Severidade original | Quantidade |",
                          "|---|---:|",
                          "| Critical | \(.metadata.vulnerabilities.critical // 0) |",
                          "| High | \(.metadata.vulnerabilities.high // 0) |",
                          "| Moderate | \(.metadata.vulnerabilities.moderate // 0) |",
                          "| Low | \(.metadata.vulnerabilities.low // 0) |",
                          "| Info | \(.metadata.vulnerabilities.info // 0) |",
                          "| Total reportado | \(.metadata.vulnerabilities.total // 0) |",
                          "",
                          "Dependências analisadas: \(.metadata.dependencies.total // 0)"
                        ' "$REPORTS/$file"
                      else
                        echo "Relatório ausente ou sem estrutura válida de vulnerabilidades."
                      fi

                      echo
                    done

                    echo "## DAST — OWASP ZAP"
                    echo

                    if [ -s "$REPORTS/dast-zap-report.json" ] &&
                      jq -e '
                        (.site | type == "array") and
                        (.site | length > 0) and
                        all(.site[]; (.alerts | type == "array"))
                      ' "$REPORTS/dast-zap-report.json" >/dev/null 2>&1; then

                      jq -r '
                        [
                          .site[]?.alerts[]? |
                          (
                            if ((.riskcode // "" | tostring) == "3") then "High"
                            elif ((.riskcode // "" | tostring) == "2") then "Medium"
                            elif ((.riskcode // "" | tostring) == "1") then "Low"
                            elif ((.riskcode // "" | tostring) == "0") then "Informational"
                            else "Unknown"
                            end
                          )
                        ] as $severities |

                        "| Severidade | Quantidade de achados |",
                        "|---|---:|",
                        (
                          ["High", "Medium", "Low", "Informational", "Unknown"][] as $severity |
                          "| \($severity) | \([$severities[] | select(. == $severity)] | length) |"
                        ),
                        "| **Total** | **\($severities | length)** |"
                      ' "$REPORTS/dast-zap-report.json"

                      echo
                      echo "Os totais correspondem aos alertas registrados no JSON original do ZAP. Os resultados dos testes complementares são apresentados separadamente."
                    else
                      echo "Relatório DAST ausente ou inválido; não foi possível determinar os totais."
                    fi

                    echo
                    echo "## Execução dos testes complementares DAST"
                    echo

                    if [ -s "$REPORTS/dast-tests.json" ] &&
                      jq -e '
                        (.schemaVersion == 1) and
                        (.counts | type == "object") and
                        (.tests | type == "array") and
                        ((.tests | length) == .total)
                      ' "$REPORTS/dast-tests.json" >/dev/null 2>&1; then

                      jq -r '
                        "| Resultado | Quantidade |",
                        "|---|---:|",
                        "| PASS | \(.counts.PASS // 0) |",
                        "| FAIL | \(.counts.FAIL // 0) |",
                        "| NOT_EVALUATED | \(.counts.NOT_EVALUATED // 0) |",
                        "| ERROR | \(.counts.ERROR // 0) |",
                        "| Total de resultados | \(.total) |",
                        "",
                        "Conclusão da suíte: \(if .completed == true and (.counts.ERROR // 0) == 0 and (.counts.NOT_EVALUATED // 0) == 0 then "completa" else "inconclusiva" end)."
                      ' "$REPORTS/dast-tests.json"
                    else
                      echo "Resumo ausente ou inválido. Não foi possível comprovar a execução da suíte complementar."
                    fi

                    echo
                    echo "## Limitações e interpretação"
                    echo
                    echo "- Os resultados representam achados reportados pelas ferramentas, não vulnerabilidades confirmadas individualmente."
                    echo "- As severidades são mantidas conforme a classificação original de cada ferramenta."
                    echo "- No SAST, os achados são contabilizados conforme os resultados presentes no JSON do Semgrep."
                    echo "- No SCA, os totais são os reportados pelo npm audit. Os relatórios de todas as dependências e de produção possuem escopos distintos e não devem ser somados."
                    echo "- No DAST, a tabela de severidade considera os alertas presentes no relatório JSON original do ZAP."
                    echo "- PASS, FAIL, NOT_EVALUATED e ERROR são estados de execução dos testes complementares e não são somados aos alertas por severidade."
                    echo "- A ausência de um relatório não significa ausência de vulnerabilidades."
                    echo "- A existência de um relatório, isoladamente, não comprova que a análise foi concluída com sucesso."
                    echo "- Os relatórios JSON originais são preservados para auditoria."
                    echo "- Os totais de SAST, SCA e DAST não devem ser somados automaticamente."
                    echo

                    echo "## Relatórios JSON incluídos"
                    echo

                    found=false
                    for file in "$REPORTS"/*.json; do
                      [ -f "$file" ] || continue
                      echo "- \`$(basename "$file")\`"
                      found=true
                    done

                    if [ "$found" = false ]; then
                      echo "Nenhum relatório JSON válido foi encontrado."
                    fi
                  } > "$OUTPUT"

                  cat "$OUTPUT"

            - name: Upload consolidated analysis
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: analysis-evidence
                  path: |
                      analysis/analysis.md
                      analysis/reports/*.json
                  if-no-files-found: warn
                  retention-days: 90
